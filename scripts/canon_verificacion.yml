# Canon de verificación — fechas de caducidad de claims críticos.
#
# Fuente de verdad de "cuándo caduca qué". Cada claim crítico del canon
# (AGENTS.md) declara su última fecha de verificación y su caducidad según la
# volatilidad del dato. `audit_canon.py` lista los vencidos.
#
# Regla: al re-verificar un claim, actualizar aquí su `fecha_verificacion`.
# No re-verificar la prosa de AGENTS.md sin tocar también esta fecha.

claims:
