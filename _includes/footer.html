<footer class="footer">
  <div class="footer-column">
    <p>
      <small>
        Creado por <a href="{{ site.author.url }}" target="_blank" rel="noopener noreferrer">{{ site.author.name }}</a>.
      </small>
    </p>
    <p>
      <small>
        Powered by <a href="https://jekyllrb.com/" target="_blank" rel="noopener noreferrer">Jekyll</a> & <a href="https://github.com/zivhub/monophase" target="_blank" rel="noopener noreferrer">Monophase</a>
      </small>
    </p>
  </div>
  {% if site.data.social %}
    <div class="footer-column">
      <ul class="social-icons">
        {% for social in site.data.social %}
          <li class="social-icon-item">
            <a class="social-icon" href="{{ social.url }}" target="_blank" rel="noopener noreferrer">
              <i class="{{ social.icon | default: 'fas fa-link' }}" title="{{ social.title }}"></i>
            </a>
          </li>
        {% endfor %}
      </ul>
    </div>
  {% endif %}
</footer>
