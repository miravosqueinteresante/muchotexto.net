name: 🇵🇾 Pulso Diario Paraguay

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-pulso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --quiet --upgrade pip

      - name: Diagnosticar API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY no configurado"
            exit 1
          fi
          echo "GEMINI_API_KEY: configurado (${#GEMINI_API_KEY} caracteres)"
          curl -s -o /dev/null -w "Gemini endpoint HTTP %{http_code}" \
            "https://generativelanguage.googleapis.com/v1/models/gemini-2.0-flash?key=$GEMINI_API_KEY"
          echo ""

      - name: Generar Pulso Paraguay
        id: pulso
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TZ: America/Asuncion
        run: python scripts/pulso_diario.py

      - name: Fix description format
        run: python scripts/fix_pulso_descriptions.py

      - name: Commit and push
        run: |
          git config user.name "Pulso Bot"
          git config user.email "pulso@muchotexto.net"
          git add _posts/
          git diff --cached --quiet || git commit -m "🇵🇾 Pulso Paraguay — $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
