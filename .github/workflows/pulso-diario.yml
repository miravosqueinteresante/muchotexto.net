name: 🇵🇾 Pulso Diario Paraguay

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-pulso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --quiet --upgrade pip

      - name: Diagnosticar API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY no configurado"
            exit 1
          fi
          echo "GEMINI_API_KEY: configurado (${#GEMINI_API_KEY} caracteres)"
          echo ""
          echo "=== Modelos disponibles (flash/lite) ==="
          curl -s "https://generativelanguage.googleapis.com/v1beta/models?key=$GEMINI_API_KEY" | \
            python3 -c "
import sys,json
data=json.load(sys.stdin)
for m in data.get('models',[]):
    n=m['name']
    if 'gemini' in n.lower() and ('flash' in n.lower() or 'lite' in n.lower() or '2.0' in n.lower() or '2.5' in n.lower()):
        print(f'  {n}')
" 2>/dev/null || echo "  (no se pudieron listar modelos)"

      - name: Generar Pulso Paraguay
        id: pulso
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TZ: America/Asuncion
        run: python scripts/pulso_diario.py

      - name: Fix description format
        run: python scripts/fix_pulso_descriptions.py

      - name: Commit and push
        run: |
          git config user.name "Pulso Bot"
          git config user.email "pulso@muchotexto.net"
          git add _posts/
          git diff --cached --quiet || git commit -m "🇵🇾 Pulso Paraguay — $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
