name: Editorial Diario

on:
  schedule:
    - cron: '0 22 * * *'   # 22:00 UTC = 18:00 PYT (invierno) — margen para delay de GH Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  editorial:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_MODELS_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar Editorial
        env:
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          TZ: America/Asuncion
        run: python scripts/editorial_diario.py

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Pulso Bot"
          git config user.email "pulso@muchotexto.net"
          git add _posts/
          git diff --cached --quiet || git commit -m "Editorial del día [$(TZ=America/Asuncion date +'%Y-%m-%d')]"
          git push
