name: Editorial Diario

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 21:00 PYT del día anterior — después del Pulso (12:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generar Editorial
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TZ: America/Asuncion
        run: python scripts/editorial_diario.py

      - name: Commit and push
        run: |
          git config user.name "Pulso Bot"
          git config user.email "pulso@muchotexto.net"
          git add _posts/
          git diff --cached --quiet || git commit -m "Editorial del día [$(TZ=America/Asuncion date +'%Y-%m-%d')]"
          git pull --rebase origin main
          git push
