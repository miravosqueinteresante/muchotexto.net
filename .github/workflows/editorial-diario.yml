name: Editorial Diario

on:
  schedule:
    - cron: '0 21 * * *'   # 21:00 UTC = 19:00 PYT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar Editorial
        env:
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
        run: python scripts/editorial_diario.py

      - name: Commit y push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Pulso Bot"
          git config user.email "pulso@muchotexto.net"
          git add _posts/
          if git diff --cached --quiet; then
            echo "No hay cambios que commitar"
          else
            git commit -m "Editorial del día [$(TZ=America/Asuncion date +'%Y-%m-%d')]"
            git push
          fi
