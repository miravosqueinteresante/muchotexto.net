name: Build and deploy Jekyll to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["🇵🇾 Pulso Diario Paraguay", "Editorial Diario"]
    types: [completed]
  schedule:
    - cron: "17 13 * * 1"  # lun 13:17 UTC / 09:17 PYT: refresco semanal de datos MuchoTexto Data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Solo buildear por workflow_run si la generacion termino bien; push/schedule/dispatch siempre.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Setup Python (sync datos)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias Python
        run: pip install pyyaml
      - name: Validar y preparar datos
        run: |
          echo "== Auditar consistencia =="
          python scripts/audit_consistency.py
          echo "== Tests de generadores =="
          python scripts/test_build_derived.py
          echo "== Sync datos (MuchoTexto Data) =="
          python scripts/sync_datos.py
          echo "== Generar superficies derivadas =="
          python scripts/build_derived.py
        env:
          JEKYLL_ENV: production
      - name: Build with Jekyll
        run: |
          echo "url: https://muchotexto.net" > _config_pages.yml
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}" --config _config.yml,_config_pages.yml
        env:
          JEKYLL_ENV: production
      - name: Ping IndexNow
        run: python scripts/ping_indexnow.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
