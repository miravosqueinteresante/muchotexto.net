name: Build and deploy Jekyll to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["🇵🇾 Pulso Diario Paraguay", "Editorial Diario"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        run: |
          echo "url: https://muchotexto.net" > _config_pages.yml
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}" --config _config.yml,_config_pages.yml
        env:
          JEKYLL_ENV: production
      - name: Validar ecosistema (observatorio)
        if: github.event_name == 'push'
        run: |
          NEW_FILES=$(git diff --name-only --diff-filter=A HEAD~1..HEAD 2>/dev/null || true)
          HAS_ARTICULO=$(echo "$NEW_FILES" | grep "_posts/" | xargs grep -l "categories: articulos" 2>/dev/null || true)
          if [ -n "$HAS_ARTICULO" ]; then
            echo "Nuevo articulo detectado. Verificando 8 paginas del observatorio..."
            CHANGED=$(git diff --name-only HEAD~1..HEAD 2>/dev/null || true)
            FAIL=0
            for page in cronologia.markdown regulacion.markdown directorio.markdown casos-de-uso.markdown glosario.markdown ia-en-paraguay.markdown llms.txt; do
              if ! echo "$CHANGED" | grep -q "$page"; then
                echo "::error::Falta $page en el commit"
                FAIL=1
              fi
            done
            if ! echo "$CHANGED" | grep -q "entidades/"; then
              echo "::error::Falta entidades/ en el commit"
              FAIL=1
            fi
            if [ "$FAIL" = "1" ]; then
              echo "::error::Articulo nuevo requiere las 8 paginas del observatorio. Deploy cancelado."
              exit 1
            fi
            echo "Observatorio completo: OK"
          fi
      - name: Setup Python (IndexNow)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ping IndexNow
        run: python scripts/ping_indexnow.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
