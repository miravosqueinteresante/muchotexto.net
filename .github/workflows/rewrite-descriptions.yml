name: Reescribir descripciones SEO

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Cantidad maxima de posts a procesar (0 = todos)"
        required: false
        default: "0"
      only:
        description: "pulso | editorial | all"
        required: false
        default: "all"
      fields:
        description: "title | desc | both"
        required: false
        default: "both"

permissions:
  contents: write

concurrency:
  group: rewrite-descriptions
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pyyaml

      - name: Generar títulos y descripciones
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rewrite_descriptions.py --limit "${{ inputs.limit }}" --only "${{ inputs.only }}" --fields "${{ inputs.fields }}"

      - name: Regenerar superficies derivadas
        run: python scripts/build_derived.py

      - name: Verificar consistencia
        run: python scripts/audit_consistency.py

      - name: Commit y push
        if: always()
        run: |
          git config user.name "Pulso Bot"
          git config user.email "pulso@muchotexto.net"
          git add -A
          git diff --cached --quiet || git commit -m "SEO: titulares y descripciones del sitio (Pulso y Editorial)"
          git pull --rebase origin main
          git push
