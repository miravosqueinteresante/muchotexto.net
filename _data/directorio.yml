- seccion: Prospectiva y planificacion
  items:
  - nombre: Paraguay 2040 — Prospectiva
    descripcion: 'Marco de escenarios a 15 anos basado en datos actuales del observatorio.
      Cinco palancas clave: diversificacion energetica (solar Chaco), fibra optica
      soberana, regulacion de data centers, formacion de talento tech y formalizacion
      del empleo.'
    url: /articulos/2026/08/05/paraguay-2040-futuro-datos/
- seccion: Aceleradoras y hubs
  items:
  - nombre: KOGA Impact Lab
    descripcion: Más de 14 años operando. Apoyó a 200+ startups y capacitó a 10.000+
      emprendedores. Funciona como aceleradora, espacio de coworking y comunidad.
      Es el punto de encuentro del ecosistema emprendedor tech en Paraguay. [Leer
      análisis completo](/articulos/2026/07/14/startups-ia-paraguay/).
    url: https://koga.com.py/
  - nombre: InnovandoPY
    descripcion: Programa del MITIC que en 2025 otorgó $140.000 en capital semilla
      a 7 startups tecnológicas. [Leer más](/articulos/2026/07/14/startups-ia-paraguay/).
    url: https://innovando.gov.py/
- seccion: Startups de IA y tecnología
  nota: '**Nota:** HIVE Digital reporta inversiones en escuelas de Valenzuela (aire
    acondicionado, cableado electrico, pintura). La cobertura de prensa local es limitada
    y no hay verificacion independiente del impacto comunitario. [Leer analisis completo](/articulos/2026/08/04/impacto-local-data-center-paraguay/).'
  items:
  - nombre: Autograph
    descripcion: Startup paraguaya mencionada en el ecosistema de IA.
    url: https://autograph.ai/
  - nombre: HIVE Digital Technologies
    descripcion: Opera 300 MW de minería Bitcoin (Tier-I) en Yguazú y Valenzuela con
      energía de Itaipú. Adquirió Yguazú de Bitfarms por USD 56M en 2025. Lanzó BUZZ
      AI Cloud en Asunción (Tier-III) y planea un data center Tier-III de IA/HPC para
      H2 2027 con 100 MW adicionales. [Leer análisis completo](/articulos/2026/07/31/silicon-valley-cono-sur-paraguay/).
    url: https://www.hivedigitaltechnologies.com/
  - nombre: BUZZ AI Cloud
    descripcion: Primer cluster de GPU para inteligencia artificial en Paraguay, lanzado
      por HIVE en un data center Tier III en Asunción (marzo 2026). [Leer análisis](/articulos/2026/07/16/ia-soberana-paraguay/).
    url: https://www.buzzhpc.ai/es/
  - nombre: Tooldata
    descripcion: Empresa chilena fundada en 2018 por Jorge Gálvez Gajardo, con sede
      en Concón, Chile. Ofrece soluciones de IA y Social Listening con fuerte presencia
      en Paraguay, donde opera adaptada a normativas locales (SIFEN, Marangatu).
    url: https://tooldata.io/social-listening-paraguay
  - nombre: ICDF Taiwan
    descripcion: Fondo de Cooperación y Desarrollo Internacional de Taiwán. Agencia
      ejecutora de Yguazú Digital. Financia proyectos de desarrollo en países aliados.
      [Leer más](/articulos/2026/08/01/modelo-itaipu-gobernanza-ia/).
    url: https://www.icdf.org.tw/
  - nombre: MADES — Direccion de Cambio Climatico
    descripcion: Direccion Nacional de Cambio Climatico y Direccion de Mercados de
      Carbono. Responsables de la NDC y el Plan Nacional de Adaptacion. [Leer mas](/articulos/2026/08/03/energia-renovable-cambio-climatico-paraguay/).
    url: https://www.mades.gov.py/
- seccion: Data centers e infraestructura
  items:
  - nombre: Yguazú Digital
    descripcion: 'Proyecto binacional Paraguay-Taiwán: Fase I 10 MW / $200-500M, Fase
      II 100 MW / ~$5B, Fase III 1 GW / ~$40B. [Leer análisis](/articulos/2026/06/23/yguazu-digital-paraguay-hub-ia-mas-grande-del-mundo/).'
  - nombre: X8Cloud
    descripcion: Plataforma de infraestructura de IA con energía de Itaipú. Promociona
      GPUs H100/A100, ahorro del 70% y latencia sub-10ms para Latinoamérica. Sin cifras
      públicas de inversión ni estado de construcción. [Leer más](/articulos/2026/07/31/silicon-valley-cono-sur-paraguay/).
    url: https://x8cloud.ai/?lang=es
  - nombre: Pardat Holding
    descripcion: Proyecta data center de 100 MW en Yguazú, 700 empleos directos e
      indirectos. [Leer más](/articulos/2026/07/10/talento-tech-paraguay-ia/).
  - nombre: Dominion AI
    descripcion: Data center subterráneo de IA. Infraestructura para alojar servidores,
      parte del ecosistema emergente de Paraguay. [Leer análisis](/articulos/2026/07/21/ia-justicia-paraguay/).
    url: https://dominionaipy.com/
  - nombre: Data Center Estatal Tier III
    descripcion: 'Adjudicado por el MITIC en mayo 2026: 5.000 VMs, 2.000 contenedores,
      financiado por el BID. [Leer más](/articulos/2026/07/16/ia-soberana-paraguay/).'
  - nombre: Tigo Business — Data Center
    descripcion: El único data center de colocation Tier III de un operador privado
      en Paraguay, en Villa Elisa. Certificado por el Uptime Institute (Diseño y Construcción),
      99,982% de disponibilidad, ISO 27001:2022.
    url: https://www.tigo.com.py/medianas/cloud/data-center
- seccion: Industria y manufactura
  items:
  - nombre: ADATA
    descripcion: Segundo fabricante global de módulos DRAM (TrendForce 2024). Evalúa
      ensamblar memorias y SSDs en Minga Guazú bajo los regímenes de maquila (Ley
      7547/2025), ensamblaje (7546) e incentivos (7548). Reunión del vicepresidente
      Felipe Masselli con MIC, Rediex y delegación de Taiwán (18-20 agosto 2026).
      Proyecto en etapa de prospección. [Leer análisis](/articulos/2026/08/28/adata-minga-guazu-memorias-semiconductores/).
    url: https://www.adata.com/
- seccion: Energía e hidrógeno verde
  items:
  - nombre: PTI-PY (Parque Tecnologico Itaipu)
    descripcion: Opera la unica unidad experimental de hidrogeno verde del Paraguay
      (2 Nm3/h). [Leer mas](/articulos/2026/07/27/hidrogeno-verde-paraguay/).
    url: https://www.pti.org.py/
  - nombre: Atome
    descripcion: Proyecto de fertilizantes verdes en Villeta. Anunciado en 2021, decision
      final de inversion (FID) alcanzada en abril 2026 con USD 665M (USD 420M deuda
      multilateral + USD 245M equity). Contrato EPC con Casale (USD 465M). Acuerdo
      con Yara. Construccion pendiente por negociacion de tarifa con ANDE. [Leer mas](/articulos/2026/07/27/hidrogeno-verde-paraguay/).
    url: https://www.atomeplc.com/
- seccion: Gobernanza energetica
  items:
  - nombre: Mesa Energetica Nacional
    descripcion: 'Organismo asesor del Presidente creado por decreto en 2012. Reactivada
      por Santiago Pena en 2023. Coordino la Politica Energetica Nacional al 2050
      (Decreto 2553/2024, 95 objetivos, 385 metas). Reconvocada el 6 de agosto de
      2026 con 30 dias para presentar propuestas en cuatro ejes: institucionalidad,
      generacion, participacion publico-privada y reglas para inversores. [Leer mas](/articulos/2026/08/12/mesa-energetica-pen-2050-paraguay/).'
    url: /articulos/2026/08/12/mesa-energetica-pen-2050-paraguay/
  - nombre: Mesa Energetica del MIC+UIP
    descripcion: Iniciativa del Ministerio de Industria y Comercio y la Union Industrial
      Paraguaya dentro del Consejo Asesor Empresarial. Concluyo el 22 de julio de
      2026 que "por primera vez en la historia tenemos mas proyectos que energia disponible"
      (Ministro Marco Riquelme). [Leer mas](/articulos/2026/08/12/mesa-energetica-pen-2050-paraguay/).
    url: /articulos/2026/08/12/mesa-energetica-pen-2050-paraguay/
  - nombre: Viceministerio de Minas y Energia (VMME)
    descripcion: Dependencia del MOPC. Autoridad que otorga licencias de generacion
      electrica privada (>1 MW). Maneja energia, minas e hidrocarburos bajo la estructura
      del Ministerio de Obras Publicas.
    url: https://minasyenergia.mopc.gov.py/
  - nombre: Ministerio de Energía, Minería e Hidrocarburos (en proyecto)
    descripcion: 'Proyecto de ley presentado el 13 de agosto de 2026 en la Mesa Nacional
      del Sector Eléctrico: 27 artículos, 3 viceministerios, absorbe al VMME (MOPC)
      y la Dirección de Combustibles (MIC), rectoría sectorial sobre ANDE/Petropar.
      Son textos en debate público, no instituciones operativas.'
    url: /articulos/2026/08/19/ministerio-energia-mineria-hidrocarburos/
  - nombre: Ente Regulador de Energía (en proyecto)
    descripcion: 'Proyecto de ley del regulador independiente: directorio 3+3 por
      concurso público, mandato 6 años, RTI cada 2 años con audiencia pública, tasa
      de regulación hasta 2%. Presentado junto al Ministerio el 13 de agosto de 2026.'
    url: /articulos/2026/08/19/ente-regulador-energia/
  - nombre: Programa GCIE de la ANDE
    descripcion: 'Grandes Consumidores de Energía Intensiva: 943,8 MW reservados para
      41 empresas (criptomineras y data centers), tarifa Resolución 49238/2024, 13,5%
      de la potencia de Itaipú. La transparencia de los contratos individuales está
      en discusión.'
    url: /articulos/2026/09/16/los-contratos-secretos-de-ande/
- seccion: Comunidades y espacios
  items:
  - nombre: Cámara Paraguaya de Fintech
    descripcion: Fundada en 2019, 120+ miembros. Agrupa al ecosistema fintech paraguayo
      que pasó de ~29 empresas en 2020 a más de 100. [Leer análisis](/articulos/2026/07/10/fintech-paraguay-ecosistema/).
    url: https://www.fintech.org.py/
  - nombre: Foro Tecnológico Bilateral Paraguay-Taiwán
    descripcion: 4 ediciones realizadas. Delegados de TSMC, ICDF y empresas taiwanesas
      participan regularmente. [Leer más](/articulos/2026/07/14/semiconductores-taiwan-paraguay/).
  - nombre: Capace
    descripcion: Cámara Paraguaya de Comercio Electrónico. Estima el mercado en USD
      2.180M. [Leer más](/articulos/2026/07/24/ecommerce-logistica-paraguay/).
    url: https://www.capace.org.py/
  - nombre: El Surti / AIkuaa
    descripcion: Medio independiente paraguayo fundado en 2016. Desarrolla AIkuaa,
      el primer dataset comunitario de voz en guaraní mediante mingas. Financiado
      por JournalismAI (LSE/Google News Initiative). [Leer análisis](/articulos/2026/07/29/guarani-ia/).
    url: https://elsurti.com/aikuaa/
  - nombre: SOPAIA
    descripcion: Sociedad Paraguaya de Inteligencia Artificial. Organización que reúne
      a profesionales, investigadores y entusiastas de la IA en Paraguay para promover
      el desarrollo y la divulgación de la inteligencia artificial en el país.
    url: https://www.sopaia.org/
  - nombre: AmCham Paraguay
    descripcion: Cámara de Comercio Paraguayo-Americana. Impulsa foros internacionales
      para posicionar a Paraguay como hub de data centers, energía limpia e IA. Organizó
      el foro en Silicon Valley (junio 2026) con el MIC.
    url: https://www.amcham.com.py/
- seccion: Logística y e-commerce
  items:
  - nombre: AEX
    descripcion: Empresa de logística y e-commerce más grande de Paraguay, fundada
      en 1996. Cubre 120+ ciudades con e-Lockers, Puntos AEX e integración Shopify.
      E-commerce Awards 2025. [Leer análisis](/articulos/2026/07/24/ecommerce-logistica-paraguay/).
    url: https://www.aex.com.py/
  - nombre: Bancard
    descripcion: Procesadora de pagos electrónicos dominante en Paraguay. Opera la
      red de pagos QR más extendida del país. [Leer más](/articulos/2026/07/24/ecommerce-logistica-paraguay/).
    url: https://www.bancard.com.py/
- seccion: Eventos
  items:
  - nombre: Smart City Paraguay 2026
    descripcion: Congreso y expo sobre ciudades inteligentes. 24 y 25 de agosto de
      2026, Paseo La Galería, Asunción. Incluye Ronda de Negocios el 25 de agosto.
      Acceso gratuito con inscripción previa.
    url: https://www.instagram.com/smartcityparaguay/
  - nombre: 2ª Convención Bancaria Paraguay 2026
    descripcion: Organizada por ASOBAN. Banca autónoma y escalabilidad de la IA. 6
      y 7 de agosto de 2026, Sheraton Asunción Hotel.
    url: https://www.asoban.org.py/eventos/convencion-bancaria-2026/
  - nombre: AI Paraguay Conference 2026
    descripcion: Conferencia exclusiva sobre IA aplicada a negocios. 11 de noviembre
      de 2026, Paseo La Galería, Asunción. Organizada por IT Alianza.
    url: https://es.linkedin.com/posts/italianza_aiparaguay-inteligenciaartificial-tecnolog%C3%ADa-activity-7483165923894280192-NZ-Y
  - nombre: IBERAMIA 2026
    descripcion: 19ª Conferencia Iberoamericana de Inteligencia Artificial. 18-20
      de noviembre de 2026, Universidad Católica, Asunción. Organizada por UNA, UCA,
      UCOM y SOPAIA.
    url: https://www.iberamia.org/iberamia/iberamia2026/
- seccion: Formación
  items:
  - nombre: Universidad Columbia del Paraguay
    descripcion: Primer programa de periodismo de datos del país (2025, 15 egresados).
    url: https://www.columbia.edu.py/
  - nombre: Universidad Politécnica Taiwán-Paraguay
    descripcion: Nuevo campus en Luque con apertura prevista para 2027.
    url: https://www.uptp.edu.py/
  - nombre: Becas de Taiwán
    descripcion: Programa de becas ampliado en junio 2026 para formación tecnológica
      de paraguayos. [Leer más](/articulos/2026/07/09/educacion-tech-paraguay-ia/).
    url: https://www.icdf.org.tw/
- seccion: Agtech
  intro: 14 startups de tecnología agrícola en Paraguay vs. 1.600 en Brasil. [Leer
    análisis completo del sector](/articulos/2026/07/13/agro-40-paraguay-ia/).
  items: []
- seccion: En construcción
  intro: 'Las siguientes secciones requieren investigación adicional y se incorporarán
    en las próximas actualizaciones trimestrales:'
  items:
  - nombre: Expertos en IA en Paraguay
    descripcion: Investigadores, profesionales y referentes del ecosistema local.
  - nombre: Comunidades de desarrolladores
    descripcion: Existen grupos activos de Telegram, Discord y WhatsApp de la comunidad
      tech paraguaya. Listado completo y verificado en investigación.
  - nombre: Inversores y fondos activos en Paraguay
    descripcion: Venture capital, aceleradoras e inversores ángel operando en el ecosistema.
- seccion: Instituciones
  items:
  - nombre: ARRN — Autoridad Reguladora Radiológica y Nuclear
    descripcion: Regulador nuclear y radiológico de Paraguay, creado por la Ley 5169/2014.
      Puede normar, licenciar y fiscalizar, pero una central nucleoeléctrica requiere
      además la autorización previa vinculante del Poder Ejecutivo.
    url: https://www.bacn.gov.py/leyes-paraguayas/2945/ley-n-5169-crea-la-autoridad-reguladora-radiologica-y-nuclear
  - nombre: MIC — Constancia de Inversionista Extranjero (SUACE)
    descripcion: El Ministerio de Industria y Comercio, a través del Sistema Unificado
      de Apertura y Cierre de Empresas (SUACE), emite la Constancia de Inversionista
      Extranjero (CIE) que acredita la inversión. La residencia permanente la concede
      luego la Dirección Nacional de Migraciones.
    url: https://www.mic.gov.py/constancias-de-inversionistas/
- seccion: Tecnología aplicada
  items:
  - nombre: BEES Paraguay (Cervepar)
    descripcion: Plataforma B2B de Cervepar para pedidos y gestión comercial, operada
      sobre la plataforma global BEES de AB InBev. Más del 85% de la facturación de
      Cervepar pasa por este canal digital.
    url: https://mybees.com.py/
