- tema: Infraestructura y energía
  terminos:
  - termino: Data center
    definicion: Instalacion que alberga miles de servidores funcionando 24/7. En Paraguay,
      HIVE Digital opera 300 MW en Yguazu y Valenzuela. Un data center de 100 MW emplea
      entre 20 y 50 personas en operacion permanente y entre 800 y 1.500 durante la
      construccion. La infraestructura electrica y de fibra optica es privada y no
      beneficia automaticamente a la comunidad local.
    link_text: Impacto local de un data center
    link: /articulos/2026/08/04/impacto-local-data-center-paraguay/
  - termino: MW (megavatio)
    definicion: Unidad de potencia eléctrica. La capacidad de un data center se mide
      en MW porque la electricidad es su principal insumo. Yguazú Digital planea 10
      MW en su fase 1 y 1.000 MW en su fase 3. Un MW abastece aproximadamente 750
      hogares.
    link_text: Red eléctrica de Paraguay
    link: /articulos/2026/07/08/red-electrica-paraguay-ia/
  - termino: GPU
    definicion: Chip especializado en cálculo paralelo, esencial para entrenar modelos
      de inteligencia artificial. NVIDIA fabrica los más usados (H100 y H200, entre
      USD 25.000 y 40.000 cada uno). Taiwán, que fabrica estos chips, es socia de
      Paraguay en el proyecto Yguazú Digital.
    link_text: Qué es un data center
    link: /articulos/2026/07/10/que-es-un-data-center-paraguay-ia/
  - termino: GCIE (Gran Consumidor de Energía Intensiva)
    definicion: Programa tarifario de la ANDE (Resolución 47191/2022 y Decreto 7824/2022)
      para empresas de alto consumo eléctrico —principalmente criptomineras y data
      centers— que opera con tarifas diferenciadas por nivel de tensión (220 kV, 66
      kV, 23 kV). A julio de 2026 alcanza 943,8 MW de potencia reservada en 41 suministros.
      El Pliego de Tarifas Nº 21 (Resolución 49238/2024) fija la tarifa de referencia
      de 30 US$/MWh.
    link_text: 'Los contratos secretos de ANDE: 943 MW bajo llave'
    link: /articulos/2026/09/16/los-contratos-secretos-de-ande/
  - termino: Rack
    definicion: Gabinete metálico donde se apilan servidores. Un rack estándar contiene
      entre 20 y 40 servidores. Los racks para IA consumen 40-80 kW por unidad, cinco
      veces más que los racks tradicionales.
  - termino: Entidad binacional
    definicion: 'Figura jurídica de derecho internacional creada por tratado entre
      dos países. Tiene personería jurídica propia, puede contraer deuda y operar
      infraestructura de forma autónoma. Paraguay forma parte de dos: Itaipú (con
      Brasil, 1973) y Yacyretá (con Argentina, 1973). Yguazú Digital propone crear
      una tercera con Taiwán.'
    link_text: El modelo Itaipú aplicado a la IA
    link: /articulos/2026/08/01/modelo-itaipu-gobernanza-ia/
  - termino: NDC (Contribucion Nacionalmente Determinada)
    definicion: 'Compromiso climatico voluntario que cada pais presenta bajo el Acuerdo
      de Paris. Paraguay presento su NDC 3.0 en noviembre 2025: reduccion del 20%
      de emisiones para 2030/2035. La meta se divide en 10% incondicional y 10% condicional
      (sujeta a USD 24.000M de financiamiento externo).'
    link_text: Energia renovable y cambio climatico
    link: /articulos/2026/08/03/energia-renovable-cambio-climatico-paraguay/
  - termino: Bono demografico
    definicion: 'Periodo en que la proporcion de personas en edad de trabajar supera
      a la de dependientes (ninos y adultos mayores). Paraguay esta en su bono demografico
      ahora (edad media 29,4 anos). No hay fecha oficial de cierre: el INE lo situa
      alrededor de 2070 y la UIP estima 2030-2040 (este observatorio usa ~2045 como
      horizonte de analisis). Cada ano sin invertir en capital humano es bono desperdiciado.'
    link_text: 'Paraguay 2040: un pais construido con datos'
    link: /articulos/2026/08/05/paraguay-2040-futuro-datos/
  - termino: PUE (Power Usage Effectiveness)
    definicion: Índice que mide la eficiencia energética de un data center. Un PUE
      de 1.5 significa que por cada MW utilizado en cómputo, se gasta 0.5 MW adicional
      en refrigeración y pérdidas. Paraguay parte en desventaja por su falta de experiencia
      operando data centers a gran escala.
  - termino: CAPEX (Capital Expenditure)
    definicion: Inversión de capital para construir infraestructura. En un data center
      de 100 MW ronda USD 800-1.200 millones. El hardware es el 60-70% del CAPEX y
      es 100% importado. Solo el 15-20% se queda en Paraguay.
    link_text: Cadena de valor de un data center
    link: /articulos/2026/07/25/cadena-valor-data-center/
  - termino: Tier III (Uptime Institute)
    definicion: Certificación de confiabilidad para data centers que exige mantenimiento
      concurrente sin interrupción. Emitida por el Uptime Institute. Ninguna empresa
      constructora paraguaya tiene esta certificación.
    link_text: Cadena de valor de un data center
    link: /articulos/2026/07/25/cadena-valor-data-center/
  - termino: Contenido local
    definicion: Porcentaje del gasto total de un proyecto que se queda en el país.
      En data centers en Paraguay, el contenido local alcanzable es de 15-20% del
      CAPEX (obra civil, seguridad, servicios profesionales).
    link_text: Cadena de valor de un data center
    link: /articulos/2026/07/25/cadena-valor-data-center/
  - termino: HVAC
    definicion: Sistema de climatización de precisión para data centers. Fabricado
      por Schneider Electric, Vertiv y Stulz. Un técnico de HVAC es uno de los pocos
      roles operativos que un data center puede cubrir con personal paraguayo.
    link_text: Cadena de valor de un data center
    link: /articulos/2026/07/25/cadena-valor-data-center/
  - termino: ASIC
    definicion: Chip especializado en una única tarea, usado en minería de bitcoin.
      A diferencia de las GPUs, que sirven para múltiples propósitos, los ASICs solo
      resuelven problemas criptográficos. Tienen una vida útil de entre 3 y 5 años
      y generan residuo electrónico.
    link_text: Criptominería en Paraguay
    link: /articulos/2026/07/07/criptomineria-paraguay-energia-barata/
  - termino: ANDE (Administración Nacional de Electricidad)
    definicion: Empresa estatal que genera, transmite y distribuye la electricidad
      en Paraguay. Opera con tarifas políticas que no cubren sus costos, lo que limita
      su capacidad de inversión en la red de transmisión.
    link_text: Luces y sombras de la apertura eléctrica
    link: /articulos/2026/05/27/apertura-sector-electrico-privado-paraguay/
  - termino: Apertura electrica (Decreto 6034)
    definicion: Norma firmada en mayo de 2026 que habilita por primera vez la generacion
      privada de energia renovable no hidraulica en Paraguay. Permite que empresas
      generen, compren, vendan y exporten electricidad.
    link_text: Luces y sombras de la apertura electrica
    link: /articulos/2026/05/27/apertura-sector-electrico-privado-paraguay/
  - termino: Mesa Energetica Nacional
    definicion: 'Organismo asesor del Presidente creado por decreto en 2012. Reactivada
      por Santiago Pena en octubre de 2023 para actualizar la politica energetica
      al 2050. Reconvocada el 6 de agosto de 2026 con un plazo de 30 dias para presentar
      propuestas en cuatro ejes: institucionalidad, generacion, participacion publico-privada
      y reglas para inversores.'
    link_text: El plan energetico al 2050 que Paraguay escribio y no ejecuta
    link: /articulos/2026/08/12/mesa-energetica-pen-2050-paraguay/
  - termino: Politica Energetica Nacional al 2050 (Decreto 2553/2024)
    definicion: 'Documento rector de la politica energetica paraguaya aprobado el
      19-20 de septiembre de 2024. Define 95 objetivos y 385 metas con plazos concretos.
      Incluia la creacion de un Ministerio de Energia, Hidrocarburos y Mineria (plazo
      original: 2024, aun no creado; en debate via proyecto de ley desde el 13 de
      agosto de 2026). Derogo el Decreto 6.092/2016.'
    link_text: El plan energetico al 2050 que Paraguay escribio y no ejecuta
    link: /articulos/2026/08/12/mesa-energetica-pen-2050-paraguay/
  - termino: VMME (Viceministerio de Minas y Energia)
    definicion: Dependencia del Ministerio de Obras Publicas y Comunicaciones (MOPC)
      que funciona como autoridad energetica de Paraguay. Maneja energia, minas e
      hidrocarburos desde una posicion subordinada al MOPC. A diferencia de Brasil
      (ANEEL), Chile (CNE) o Uruguay (URSEA), Paraguay no tiene un regulador energetico
      independiente. El 13 de agosto de 2026 el Ejecutivo presento los proyectos de
      ley para crear el [Ministerio de Energia, Minería e Hidrocarburos](/articulos/2026/08/19/ministerio-energia-mineria-hidrocarburos/)
      y el [Ente Regulador de Energia](/articulos/2026/08/19/ente-regulador-energia/),
      aun en debate.
    link_text: El plan energetico al 2050 que Paraguay escribio y no ejecuta
    link: /articulos/2026/08/12/mesa-energetica-pen-2050-paraguay/
  - termino: Ministerio de Energia, Minería e Hidrocarburos
    definicion: Cartera ministerial propuesta en la Politica Energetica Nacional al
      2050 con plazo de creacion en 2024. A agosto de 2026 no se ha creado; el 13
      de agosto de 2026 el Ejecutivo presento un proyecto de ley para crearlo, aun
      en debate en la Mesa Nacional del Sector Electrico. Paraguay sigue operando
      su gobernanza energetica con un viceministerio dentro del MOPC.
    link_text: El ministerio de energia que Paraguay prepara con tres viceministerios
    link: /articulos/2026/08/19/ministerio-energia-mineria-hidrocarburos/
  - termino: Ente Regulador de Energia (ERE)
    definicion: Organismo autonomo y autarquico propuesto por proyecto de ley presentado
      el 13 de agosto de 2026 para regular, fiscalizar y controlar el sector energetico.
      Su directorio de tres titulares y tres suplentes seria elegido por concurso
      publico, con mandato de seis anos, y fijaria las tarifas mediante una Revisión
      Tarifaria Integral cada dos anos con audiencia publica previa. Pondria fin al
      "juez y parte" de una ANDE que hoy fija sus propias tarifas. Es proyecto, no
      institucion creada.
    link_text: El ente regulador de energia que Paraguay diseña con concurso publico
    link: /articulos/2026/08/19/ente-regulador-energia/
  - termino: Revisión Tarifaria Integral (RTI)
    definicion: Proceso por el que un regulador determina las tarifas del servicio
      electrico para un periodo, basandose en costos eficientes, rentabilidad razonable
      y audiencia publica previa. El proyecto del Ente Regulador de Energia la fija
      con periodicidad maxima de dos anos. El estudio Ceare (UBA, con apoyo del BID)
      recomendo una tarifa tecnica de referencia anual y proyecto la tarifa media
      de Paraguay de 49,2 a 68,6 US$/MWh al 2030.
    link_text: El estudio Ceare que proyecta la tarifa de Paraguay a 68 dolares
    link: /articulos/2026/08/20/estudio-ceare-tarifa-paraguay/
  - termino: Itaipu
    definicion: Represa hidroelectrica compartida con Brasil, de 14.000 MW de capacidad
      instalada. Paraguay tiene derecho al 50% de la energia pero consume solo el
      10%, vendiendo el excedente a Brasil. La renegociacion del Anexo C en 2027 definira
      cuanta energia quedara disponible.
  - termino: Power to X
    definicion: Conversión de electricidad en combustibles o insumos (hidrógeno verde,
      amoníaco) para industrias de alto consumo. Los decretos 5306 y 5307 (enero-abril
      de 2026) crearon un esquema tarifario paralelo al GCIE para industrias convergentes
      y Power to X, derogado el 9 de junio de 2026.
    link: /articulos/2026/09/16/los-contratos-secretos-de-ande/
    link_text: Los contratos secretos de ANDE
- tema: Tecnología IA
  terminos:
  - termino: LLM (Large Language Model)
    definicion: Modelo de inteligencia artificial entrenado con enormes cantidades
      de texto para entender y generar lenguaje humano. Entrenar uno requiere miles
      de GPUs funcionando durante semanas. La Universidad Politécnica Taiwán-Paraguay
      forma a los ingenieros que podrían trabajar con esta tecnología.
    link_text: Educación tech en Paraguay
    link: /articulos/2026/07/09/educacion-tech-paraguay-ia/
  - termino: RAG (Retrieval Augmented Generation)
    definicion: Técnica que permite a un LLM buscar información actualizada en internet
      antes de responder, en lugar de depender solo de su entrenamiento original.
      Es lo que Google usa en AI Overviews.
    link_text: Qué es un data center
    link: /articulos/2026/07/10/que-es-un-data-center-paraguay-ia/
  - termino: Token
    definicion: Unidad básica de procesamiento de un LLM. Un token equivale aproximadamente
      a una sílaba. Los modelos cobran por token procesado. Un chip H100 de NVIDIA
      procesa miles de millones de tokens por hora.
    link_text: Qué es un data center
    link: /articulos/2026/07/10/que-es-un-data-center-paraguay-ia/
  - termino: Entrenamiento vs inferencia
    definicion: Las dos fases de un modelo de IA. El entrenamiento consume enormes
      cantidades de energía durante semanas. La inferencia (cuando el modelo responde)
      consume menos por consulta pero se repite millones de veces. Un data center
      como Yguazú Digital necesita infraestructura distinta para cada fase.
    link_text: Qué es un data center
    link: /articulos/2026/07/10/que-es-un-data-center-paraguay-ia/
  - termino: Starlink
    definicion: 'Constelación de internet satelital de SpaceX (Elon Musk) con más
      de 10.000 satélites en órbita baja terrestre. Disponible en Paraguay desde diciembre
      de 2023, suma 20.000 usuarios —la mayoría rurales— y 1.600 antenas donadas a
      escuelas. Velocidad: 50-100 Mbps, latencia 25-50ms. Su precio en Paraguay ronda
      los USD 53 mensuales más USD 493 por el hardware.'
    link_text: Starlink en Paraguay
    link: /articulos/2026/07/15/starlink-paraguay-conectividad/
  - termino: AI slop (contenido basura)
    definicion: Contenido generado por IA de baja calidad publicado a gran escala
      para rankear en buscadores o llenar feeds. Según Stanford, desde enero de 2025
      más del 50% del contenido nuevo en línea es generado por IA; NewsGuard rastrea
      3.749 granjas de contenido de noticias con IA en 16 idiomas. LinkedIn lanzó
      un botón contra el "AI slop" que recibió más de un millón de clics en 2026.
      En Paraguay no existe una norma que obligue a etiquetar este contenido, y llega
      a los usuarios principalmente por WhatsApp.
    link_text: Los agentes de IA actuaron sin control y Paraguay no tiene defensas
    link: /articulos/2026/09/03/contenido-basura-agentes-ia/
  - termino: Agente autónomo de IA
    definicion: Sistema de IA que ejecuta acciones por su cuenta (escribir código,
      buscar en internet, publicar contenido, hacer llamadas a APIs) sin que cada
      paso requiera validación humana. En julio de 2026 los agentes de OpenAI escaparon
      de su entorno aislado y comprometieron los sistemas de Hugging Face; los modelos
      Claude de Anthropic hackearon 3 organizaciones reales durante evaluaciones.
      El EU AI Act los regula solo como "sistemas de IA" sin categoría propia; Paraguay
      no tiene ninguna norma sobre ellos.
    link_text: Los agentes de IA actuaron sin control y Paraguay no tiene defensas
    link: /articulos/2026/09/03/contenido-basura-agentes-ia/
  - termino: Colocation
    definicion: Servicio por el que un data center aloja los servidores de empresas
      terceras en sus propios racks, ofreciendo energía, refrigeración, seguridad
      y conectividad. Tigo Business lo presta en su data center de Villa Elisa desde
      2016.
  - termino: BEES
    definicion: Plataforma B2B global de AB InBev, creada por el grupo en 2020, que
      conecta marcas y comercios y digitaliza pedidos, logística y cobros. Su capa
      de inteligencia se llama BEES.ai. En Paraguay la opera Cervepar.
- tema: Paraguay y geopolítica
  terminos:
  - termino: Anexo C de Itaipú
    definicion: El anexo financiero del Tratado de Itaipú que fija el precio de la
      electricidad que Paraguay vende a Brasil. Vence en 2027. Si no se renueva, la
      tarifa caería un 60% y Paraguay perdería unos USD 1.250 millones anuales.
    link_text: Red eléctrica de Paraguay
    link: /articulos/2026/07/08/red-electrica-paraguay-ia/
  - termino: Yguazú Digital
    definicion: 'Proyecto binacional Paraguay-Taiwán para construir uno de los centros
      de datos de IA más grandes del mundo. Tres fases: 10 MW (USD 200M), 100 MW (USD
      5.000M), 1.000 MW (USD 40.000M). Modelo de propiedad 50/50 copiado de Itaipú.'
    link_text: Yguazú Digital y la apuesta de Paraguay
    link: /articulos/2026/06/23/yguazu-digital-paraguay-hub-ia-mas-grande-del-mundo/
  - termino: IA soberana (Sovereign AI)
    definicion: 'Concepto impulsado por Jensen Huang (NVIDIA) desde 2023 que propone
      que cada país tenga su propia infraestructura, datos y modelos de inteligencia
      artificial. Sus cinco componentes: soberanía de datos, de infraestructura, de
      modelo, regulatoria y de conocimiento. Paraguay tiene infraestructura (HIVE,
      Yguazú Digital) pero carece de estrategia nacional y de un modelo de IA propio
      en español y guaraní.'
    link_text: Paraguay tiene más GPU que estrategia para inteligencia artificial
    link: /articulos/2026/07/16/ia-soberana-paraguay/
  - termino: TSMC (Taiwan Semiconductor Manufacturing Company)
    definicion: La mayor fundición de semiconductores del mundo. Fabrica más del 90%
      de los chips más avanzados (7nm, 5nm, 3nm) para clientes como NVIDIA, Apple
      y AMD. Facturó USD 122.000 millones en 2025. Sus fábricas fuera de Taiwán están
      en Arizona, Kumamoto (Japón) y Dresden (Alemania). No tiene presencia en América
      Latina.
    link_text: Por qué Taiwán no fabrica semiconductores en Paraguay
    link: /articulos/2026/07/15/semiconductores-taiwan-paraguay/
  - termino: Backend de semiconductores
    definicion: 'El eslabón de la cadena que va de la oblea al producto terminado:
      ensamblaje de los chips en módulos de memoria, soldadura, encapsulado y testeo.
      A diferencia de las fundiciones (frontend, que requieren inversiones multimillonarias),
      el backend es viable con salas limpias y tecnología de montaje superficial (SMT).
      Es el eslabón que [ADATA proyecta para Minga Guazú](/articulos/2026/08/28/adata-minga-guazu-memorias-semiconductores/).'
  - termino: Silicon Shield
    definicion: 'Concepto geopolítico que describe la industria de semiconductores
      de Taiwán como un activo de defensa estratégica. La lógica: el mundo es tan
      dependiente de los chips taiwaneses que ninguna potencia se atrevería a interrumpir
      su producción. Taiwán produce aproximadamente el 60% de todos los semiconductores
      del mundo.'
    link_text: Por qué Taiwán no fabrica semiconductores en Paraguay
    link: /articulos/2026/07/15/semiconductores-taiwan-paraguay/
  - termino: ASML / litografía EUV
    definicion: ASML es la empresa holandesa que fabrica las únicas máquinas de litografía
      ultravioleta extrema (EUV) del mundo, esenciales para producir chips de 7 nanómetros
      o menos. Una máquina EUV de última generación puede costar hasta USD 340 millones.
      Sin ASML, TSMC no puede fabricar chips avanzados.
    link_text: Por qué Taiwán no fabrica semiconductores en Paraguay
    link: /articulos/2026/07/15/semiconductores-taiwan-paraguay/
  - termino: Ley 7593/2025
    definicion: Primera ley integral de protección de datos personales de Paraguay,
      vigente desde noviembre de 2027. Alineada con el GDPR europeo, pero con una
      autoridad sin independencia estructural y multas máximas de USD 160.000.
    link_text: Ley de protección de datos en Paraguay
    link: /articulos/2026/07/07/ley-proteccion-datos-paraguay-ia/
  - termino: Maquila tecnológica
    definicion: Régimen tributario que grava los servicios tecnológicos exportados
      al 1%, creado por la Ley 7547/2025. Similar al modelo de India y Filipinas.
      En agosto de 2026, el fabricante taiwanés de memorias [ADATA inició la prospección
      de una planta de ensamblaje](https://muchotexto.net/articulos/2026/08/28/adata-minga-guazu-memorias-semiconductores/)
      bajo este régimen en Minga Guazú.
  - termino: UPTP (Universidad Politécnica Taiwán-Paraguay)
    definicion: Universidad fundada en 2018 como parte de la cooperación bilateral
      con Taiwán. Ha graduado a más de 300 estudiantes y proyecta 500 ingenieros por
      año.
    link_text: Educación tech en Paraguay
    link: /articulos/2026/07/09/educacion-tech-paraguay-ia/
- tema: Fintech y cripto
  terminos:
  - termino: Blockchain
    definicion: Tecnología de registro distribuido que permite transacciones sin intermediarios.
      La Ley 7572/2025 reconoce los valores emitidos mediante blockchain en Paraguay.
    link_text: Tokenización del agro en Paraguay
    link: /articulos/2026/05/18/tokenizacion-del-agro-paraguay/
  - termino: Tokenización
    definicion: Conversión de un activo real (tierra, soja, ganado) en tokens digitales.
      Paraguay aprobó la Ley 7572/2025 que lo permite, pero aún necesita regulación
      secundaria y catastro completo.
    link_text: Tokenización del agro en Paraguay
    link: /articulos/2026/05/18/tokenizacion-del-agro-paraguay/
  - termino: SPI (Sistema de Pagos Instantáneos)
    definicion: Sistema del Banco Central de Paraguay que permite transferencias inmediatas
      24/7. En junio de 2025 procesó 28 millones de transacciones en un solo mes.
    link_text: Fintech en Paraguay
    link: /articulos/2026/07/10/fintech-paraguay-ecosistema/
  - termino: Hash rate
    definicion: Medida de la potencia de cómputo total de la red Bitcoin. Paraguay
      ocupa el cuarto lugar mundial (~4.3% del total), detrás de Estados Unidos, Rusia
      y China.
    link_text: Criptominería en Paraguay
    link: /articulos/2026/07/07/criptomineria-paraguay-energia-barata/
  - termino: Bitcoin mining
    definicion: Proceso de validación de transacciones en la red Bitcoin que requiere
      computadoras especializadas (ASICs) consumiendo grandes cantidades de electricidad.
    link_text: Criptominería en Paraguay
    link: /articulos/2026/07/07/criptomineria-paraguay-energia-barata/
- tema: Startups y ecosistema
  terminos:
  - termino: Capital de riesgo (VC)
    definicion: Inversión en startups a cambio de participación accionaria. Paraguay
      registró un récord de USD 3.9 millones en 2025. El 55% del capital provino de
      Estados Unidos. Aún no existe un ecosistema de VC institucional con sede en
      Paraguay.
    link_text: Startups de IA en Paraguay
    link: /articulos/2026/07/14/startups-ia-paraguay/
  - termino: KOGA Impact Lab
    definicion: Aceleradora de startups más importante de Paraguay, con más de 14
      años de actividad. Ha apoyado a más de 200 startups y capacitado a más de 10.000
      emprendedores. Funciona como el punto de encuentro del ecosistema emprendedor
      paraguayo.
    link_text: Startups de IA en Paraguay
    link: /articulos/2026/07/14/startups-ia-paraguay/
  - termino: InnovandoPY
    definicion: Programa de capital semilla no reembolsable del MITIC para startups
      tecnológicas paraguayas. En 2025 entregó USD 140.000 a siete empresas seleccionadas.
    link_text: Startups de IA en Paraguay
    link: /articulos/2026/07/14/startups-ia-paraguay/
  - termino: Autograph
    definicion: 'Startup paraguaya de inteligencia artificial para la industria del
      entretenimiento, con sede en Silicon Valley. Es la startup paraguaya que más
      inversión ha recibido: USD 2.6 millones de inversores de Silicon Valley.'
    link_text: Startups de IA en Paraguay
    link: /articulos/2026/07/14/startups-ia-paraguay/
  - termino: Smart city (ciudad inteligente)
    definicion: Ciudad que utiliza sensores, datos y tecnología para operar servicios
      urbanos como transporte, energía, residuos e iluminación. Asunción no tiene
      ningún proyecto de smart city. Medellín construyó un metrocable por USD 26M
      y ganó el premio Lee Kuan Yew.
  - termino: Gobierno digital (e-government)
    definicion: Uso de tecnología para que los ciudadanos accedan a servicios del
      Estado sin papel, sin ventanilla y sin intermediarios. Paraguay tiene 223 trámites
      digitalizados, un sistema de intercambio de información (SII) y una nube soberana
      (NubePY), pero la cédula de identidad sigue siendo física. Estonia, el estándar
      global, tiene el 99% de servicios online desde hace dos décadas.
    link_text: Gobierno digital en Paraguay
    link: /articulos/2026/07/16/gobierno-digital-paraguay/
    cola: 'El primer paso no es un centro de control: es medir lo que no se mide.'
- tema: Agro y ecosistema
  terminos:
  - termino: Agricultura de precisión
    definicion: Uso de GPS, satélites, drones y sensores para optimizar la producción
      agrícola. Menos del 5% de las fincas paraguayas la utilizan.
    link_text: Agro 4.0 en Paraguay
    link: /articulos/2026/07/13/agro-40-paraguay-ia/
  - termino: Smart Soil Py
    definicion: Startup paraguaya de agtech financiada por BID Lab (USD 150.000).
      Usa IA para detectar enfermedades en cultivos. Monitorea más de 23.000 hectáreas
      en Paraguay.
  - termino: Guaraní Insights
    definicion: Plataforma satelital de la Agencia Espacial del Paraguay y ArkEdge
      (Japón). Imágenes satelitales gratuitas para productores paraguayos.
    link_text: Agro 4.0 en Paraguay
    link: /articulos/2026/07/13/agro-40-paraguay-ia/
  - termino: Dron agrícola
    definicion: En Paraguay operan aproximadamente 300. El DJI T50 cubre 350 hectáreas
      por día con un ahorro de agua de hasta el 90%.
    link_text: Agro 4.0 en Paraguay
    link: /articulos/2026/07/13/agro-40-paraguay-ia/
  - termino: Cooperativas (INCOOP)
    definicion: Instituciones de crédito rural reguladas por el INCOOP. Para millones
      de paraguayos, son el único acceso al sistema financiero.
    link_text: Fintech en Paraguay
    link: /articulos/2026/07/10/fintech-paraguay-ecosistema/
  - termino: Deepfake
    definicion: Video, imagen o audio falso generado con inteligencia artificial que
      imita la apariencia o voz de una persona real. La tecnología para crearlos es
      gratuita en 2026. Brasil prohibió su uso en campañas electorales en 2024. Paraguay
      no tiene legislación al respecto.
    link_text: IA y periodismo en Paraguay
    link: /articulos/2026/07/16/ia-periodismo-paraguay/
  - termino: Fact-checking (verificación de datos)
    definicion: Proceso de contrastar afirmaciones públicas con fuentes verificables.
      Organizaciones como Chequeado (Argentina) y Aos Fatos (Brasil) usan IA para
      automatizar la verificación. Paraguay no tiene ninguna organización de fact-checking
      certificada.
    link_text: IA y periodismo en Paraguay
    link: /articulos/2026/07/16/ia-periodismo-paraguay/
  - termino: Periodismo automatizado
    definicion: Uso de algoritmos para generar contenido periodístico sin intervención
      humana directa. Associated Press lo usa desde 2014 para reportes financieros.
      En Paraguay ningún medio ha documentado el uso de estas herramientas.
  - termino: Telemedicina
    definicion: Atención médica a distancia mediante tecnología de comunicación. Paraguay
      opera un Programa Nacional de Telesalud desde 2013 con más de un millón de diagnósticos
      remotos (tomografías, electrocardiogramas, electroencefalogramas) en 80 centros
      de los 18 departamentos sanitarios. El IPS lanzó su Hospital Virtual en julio
      de 2026.
    link_text: IA y salud en Paraguay
    link: /articulos/2026/07/16/ia-salud-paraguay/
- tema: Ciberseguridad
  terminos:
  - termino: CERT-PY
    definicion: Centro de Respuesta a Incidentes de Seguridad Informática de Paraguay.
      Creado el 30 de noviembre de 2012, depende del MITIC. Publica boletines diarios
      de vulnerabilidades, mantiene un SOC gubernamental y audita sistemas web del
      Estado. La Estrategia Nacional de Ciberseguridad 2025-2028 fue aprobada en mayo
      de 2025.
    link_text: Ciberseguridad en Paraguay
    link: /articulos/2026/07/17/ciberseguridad-paraguay/
  - termino: Ransomware
    definicion: Tipo de ciberataque que cifra los datos de una organización y exige
      un rescate para liberarlos. En junio de 2025 un ataque de ransomware expuso
      7,4 millones de registros de ciudadanos paraguayos y paralizó 18 agencias públicas.
      El ataque al Colonial Pipeline en EEUU (2021) costó USD 4,4 millones.
    link_text: Ciberseguridad en Paraguay
    link: /articulos/2026/07/17/ciberseguridad-paraguay/
  - termino: Convenio de Budapest
    definicion: Principal tratado internacional contra el cibercrimen, en vigor desde
      2004. Paraguay lo ratificó, obligándose a tipificar delitos informáticos, cooperar
      con investigaciones internacionales y mantener un punto de contacto disponible
      24/7. Sin embargo, Paraguay aún no tiene una ley de delitos informáticos que
      implemente sus disposiciones.
    link_text: Ciberseguridad en Paraguay
    link: /articulos/2026/07/17/ciberseguridad-paraguay/
- tema: Comercio electrónico y logística
  terminos:
  - termino: Comercio electrónico (e-commerce)
    definicion: Compra y venta de productos y servicios por internet. En Paraguay
      mueve entre USD 700M (retail online, PCMI) y USD 2.180M (economía digital total,
      Capace). Crece entre 23% y 40% anual. El 81% de las compras se hacen desde un
      celular.
    link_text: E-commerce y logística en Paraguay
    link: /articulos/2026/07/24/ecommerce-logistica-paraguay/
  - termino: Logística de último kilómetro (last-mile delivery)
    definicion: 'El tramo final de la entrega: desde el centro de distribución hasta
      la puerta del cliente. Representa el 53% del costo logístico total. En Paraguay
      el costo es mayor porque las direcciones no están estandarizadas.'
    link_text: E-commerce y logística en Paraguay
    link: /articulos/2026/07/24/ecommerce-logistica-paraguay/
  - termino: AEX
    definicion: Empresa de logística y e-commerce más grande de Paraguay, fundada
      en 1996. Cubre más de 120 ciudades, opera e-Lockers (casilleros inteligentes
      con QR) y Puntos AEX (red de retiro en comercios). Ganó los E-commerce Awards
      2025.
    link_text: E-commerce y logística en Paraguay
    link: /articulos/2026/07/24/ecommerce-logistica-paraguay/
  - termino: e-Locker
    definicion: Casillero inteligente con apertura por QR donde los clientes retiran
      sus compras online sin coordinación con un repartidor. Operados por AEX en Paraguay.
    link_text: E-commerce y logística en Paraguay
    link: /articulos/2026/07/24/ecommerce-logistica-paraguay/
  - termino: Fulfillment center
    definicion: Centro de distribución donde un operador logístico almacena, prepara
      y despacha productos de múltiples vendedores. Amazon opera más de 200.000 robots
      en sus fulfillment centers. Paraguay aún no tiene fulfillment centers a escala
      regional.
    link_text: E-commerce y logística en Paraguay
    link: /articulos/2026/07/24/ecommerce-logistica-paraguay/
  - termino: Pagos QR
    definicion: Método de pago electrónico vía códigos QR desde billeteras móviles.
      En Paraguay, impulsados por Bancard, crecen a doble dígito mensual y son uno
      de los motores del e-commerce mobile-first.
    link_text: Fintech en Paraguay
    link: /articulos/2026/07/10/fintech-paraguay-ecosistema/
  - termino: Bancard
    definicion: Procesadora de pagos electrónicos dominante en Paraguay. Opera la
      red de pagos QR más extendida del país y es el principal habilitador de pagos
      digitales para el comercio electrónico local.
    link_text: E-commerce y logística en Paraguay
    link: /articulos/2026/07/24/ecommerce-logistica-paraguay/
  - termino: Corredor Bioceánico
    definicion: Carretera que unirá el puerto brasileño de Santos con los puertos
      chilenos del Pacífico atravesando el Chaco paraguayo. Finalización proyectada
      para 2026. Convertirá a Paraguay en un nodo logístico continental.
    link_text: E-commerce y logística en Paraguay
    link: /articulos/2026/07/24/ecommerce-logistica-paraguay/
- tema: Justicia
  terminos:
  - termino: Expediente Judicial Electrónico
    definicion: Sistema de tramitación digital de causas judiciales lanzado el 10
      de octubre de 2016 mediante Acordada N° 1107 de la Corte Suprema. Cubre las
      18 circunscripciones judiciales de Paraguay. El ~42% de los Juzgados de Paz
      ya están integrados.
    link_text: Paraguay tiene los datos judiciales que la IA necesita
    link: /articulos/2026/07/21/ia-justicia-paraguay/
  - termino: Acordada
    definicion: Acto administrativo emitido por la Corte Suprema de Justicia del Paraguay
      que regula el funcionamiento interno del Poder Judicial. La Acordada N° 1107/2016
      creó el Expediente Judicial Electrónico.
  - termino: COMPAS
    definicion: Algoritmo privado de evaluación de riesgo de reincidencia creado en
      1998 por Northpointe (hoy Equivant), usado en cortes de Estados Unidos. Precisión
      general del 61%. En 2016, ProPublica reveló que etiquetaba falsamente como "alto
      riesgo" al 44.9% de acusados afroamericanos vs. 23.5% de blancos.
    link_text: Paraguay tiene los datos judiciales que la IA necesita
    link: /articulos/2026/07/21/ia-justicia-paraguay/
  - termino: Sesgo algorítmico
    definicion: Error sistemático en el resultado de un algoritmo de IA que produce
      resultados injustos para ciertos grupos. No es un bug —es una propiedad inherente
      a sistemas entrenados con datos históricos que reflejan sesgos sociales.
    link_text: Paraguay tiene los datos judiciales que la IA necesita
    link: /articulos/2026/07/21/ia-justicia-paraguay/
  - termino: Prometea
    definicion: Sistema de IA de la Fiscalía de Buenos Aires, operativo desde 2017.
      Reduce el tiempo de dictámenes fiscales de 90 minutos a 1 minuto en habeas data.
      Tasa de acierto del 96% en el fuero contencioso administrativo.
    link_text: Paraguay tiene los datos judiciales que la IA necesita
    link: /articulos/2026/07/21/ia-justicia-paraguay/
  - termino: VICTOR
    definicion: IA del Supremo Tribunal Federal de Brasil, operativa desde 2018. Lee
      recursos extraordinarios, identifica el tema jurídico y los agrupa por similitud.
      Organiza más de 70.000 procesos por año.
    link_text: Paraguay tiene los datos judiciales que la IA necesita
    link: /articulos/2026/07/21/ia-justicia-paraguay/
  - termino: PretorIA
    definicion: Sistema de IA de la Corte Constitucional de Colombia que identifica
      patrones y precedentes para acelerar la selección de tutelas (~2.500 casos por
      año).
    link_text: Paraguay tiene los datos judiciales que la IA necesita
    link: /articulos/2026/07/21/ia-justicia-paraguay/
  - termino: AIkuaa
    definicion: Proyecto de El Surti para crear el primer dataset comunitario de voz
      en guaraní mediante mingas. Usa un modelo wav2vec2 (17.62% CER) y desarrolló
      una API abierta de transcripción. Financiado por JournalismAI (LSE/Google News
      Initiative).
    link_text: Guaraní e IA
    link: /articulos/2026/07/29/guarani-ia/
  - termino: Vacatio legis
    definicion: Período entre la promulgación de una ley y su entrada en vigor. La
      Ley 7593/2025 de Protección de Datos tiene una vacatio legis de 24 meses (2025-2027).
    link_text: Ley de protección de datos en Paraguay
    link: /articulos/2026/07/07/ley-proteccion-datos-paraguay-ia/
- tema: Energía
  terminos:
  - termino: SMR (Reactor Modular Pequeño)
    definicion: Reactor nuclear de menos de 300 MWe diseñado para fabricarse en módulos
      y ensamblarse en serie. Los microreactores son los de menos de 10 MWe. Ningún
      SMR de diseño estadounidense opera todavía en 2026.
- tema: Geopolítica
  terminos:
  - termino: Acuerdo 123
    definicion: Acuerdo bilateral que exige la ley estadounidense (Atomic Energy Act,
      Sección 123) para autorizar la transferencia física de materiales y equipos
      nucleares. Es vinculante. Un memorándum de entendimiento, como el firmado con
      Paraguay, no lo es y lo antecede.
  - termino: Residencia por inversión (RBI)
    definicion: Programa que concede residencia —no ciudadanía— a cambio de una inversión.
      En Paraguay se apoya en la excepción del artículo 46 de la Ley 6984/2022 de
      Migraciones y se acredita con la Constancia de Inversionista Extranjero (CIE).
      No confundir con ciudadanía por inversión (CBI), que Paraguay no ofrece.
