# Entidades clave del Observatorio de IA en Paraguay
# Lista curada manualmente. build_entities.py escanea _posts/ para
# encontrar articulos relacionados y regenera las paginas de entidad.
#
# Los textos DEBEN usar acentos y caracteres del espanol correctamente.

- slug: mitic
  name: MITIC
  name_full: Ministerio de Tecnologías de la Información y Comunicación
  description: >
    Creado en 2018, el MITIC es el ministerio responsable de la política digital
    de Paraguay. Administra la identidad electrónica (1.5M+ usuarios), los 480+
    trámites digitales del portal Paraguay.gov.py, y la infraestructura de datos
    del Estado. Es la contraparte del BID en la Agenda Digital y lidera la
    consulta pública para la Estrategia Nacional de IA.
  category: gobierno
  featured: true
  related_laws:
    - "Ley 6822/2022 — servicios de confianza electrónica"
    - "Ley 7593/2025 — protección de datos personales"
  faq:
    - q: "¿Qué es el MITIC y cuándo se creó?"
      a: "El MITIC (Ministerio de Tecnologías de la Información y Comunicación) se creó en 2018 y es responsable de la política digital de Paraguay, incluyendo identidad electrónica, trámites digitales y la Estrategia Nacional de IA."
    - q: "¿Cuántos trámites digitales ofrece Paraguay.gov.py?"
      a: "El portal Paraguay.gov.py ofrece más de 480 trámites digitales, con más de 1.5 millones de usuarios registrados con identidad electrónica."
    - q: "¿Paraguay tiene una estrategia nacional de IA?"
      a: "El MITIC lidera la consulta pública para la Estrategia Nacional de IA, alineada con la Agenda Digital y los compromisos de transformación digital del país."


- slug: ande
  name: ANDE
  name_full: Administración Nacional de Electricidad
  description: >
    La ANDE es la empresa estatal de electricidad de Paraguay. Opera 16.000 MW
    de capacidad instalada (Itaipú, Yacyretá, Acaray) con la tarifa industrial
    más baja de Sudamérica (0.03-0.05 USD/kWh). Es el actor central en la apertura
    del sector eléctrico (Ley 7599/2025, Decreto 6034) y el principal proveedor
    de energía para data centers y criptominería.
  category: infraestructura
  featured: true
  datos_url: "https://datospublicos.muchotexto.net/energia.html"
  datos_desc: "sistema eléctrico paraguayo: consumo, demanda, pérdidas, clientes y tarifas"
  related_laws:
    - "Ley 7599/2025 y Decreto 6034/2026 — apertura del sector eléctrico al sector privado"
    - "Ley 7547/2025 — reforma de la Ley de Maquila, incluye servicios intangibles"
    - "Tarifa de Itaipú 2024-2026 — USD 19.28/kW-mes, venta de excedente al mercado brasileño"
    - "Anexo C del Tratado de Itaipú — vence 1 de enero de 2027"
  manual_articles:
    - title: "La energía nuclear que Paraguay firmó con EE.UU. no es un reactor"
      url: /articulos/2026/09/23/energia-nuclear-paraguay-eeuu/
      context: "El MOU nuclear con EE.UU. no es un Acuerdo 123 ni una promesa de reactor; ANDE y MOPC participaron del recorrido institucional previo."
    - title: "El Estado ya puede comprar I+D, pero no es una venta segura"
      url: /articulos/2026/11/16/compra-publica-innovacion-paraguay/
      context: "ANDE es uno de los dos pilotos de Compra Pública de Innovación: el reto Energía Segura busca reducir pérdidas eléctricas no técnicas en baja tensión en una zona crítica de Luque."
  faq:
    - q: "¿Cuánta energía genera Paraguay y cuánto consume?"
      a: "Paraguay genera aproximadamente 44 TWh/año. El consumo nacional es de 29.4 TWh (2025), dejando un excedente de ~15 TWh (~35%) que se exporta a Brasil y Argentina."
    - q: "¿Cuál es la tarifa de ANDE para data centers de IA?"
      a: "La Resolución 52552/2026 establece una tarifa media de 48.91 USD/MWh en 220 kV y 56.39 USD/MWh en 23 kV, con ajuste anual por CPI+PPI y piso del 2.5%."
    - q: "¿Qué porcentaje de la energía paraguaya es renovable?"
      a: "El 99.998% de la matriz eléctrica es renovable: Itaipú (86%), Yacyretá (11%) y Acaray (3%). No existen parques solares ni eólicos utility-scale en operación."
    - q: "¿Cuánta potencia reservada tienen las empresas intensivas en energía?"
      a: "41 empresas del grupo GCIE (criptominería) tienen 943.8 MW de potencia reservada contratada. Desde octubre 2026, IA/nube/HPC se contabilizan aparte (Res. 52552/2026)."


- slug: itaipu
  name: Itaipú
  name_full: Itaipú Binacional
  description: >
    La hidroeléctrica más grande del mundo en generación acumulada, operada por
    Paraguay y Brasil desde 1973. Genera 14.000 MW; Paraguay consume ~20% de su
    mitad y vende el resto a Brasil. El Anexo C del tratado vence en enero 2027.
    La energía de Itaipú alimenta los data centers de HIVE y es la ventaja
    competitiva central de Paraguay en la economía de la IA.
  category: infraestructura
  featured: true
  datos_url: "https://datospublicos.muchotexto.net/itaipu.html"
  datos_desc: "serie 2000–2026: generación por sector 50/60 Hz y suministro a Paraguay y Brasil"
  related_laws:
    - "Anexo C del Tratado de Itaipú — vence 1 enero 2027"
    - "Tarifa Itaipú 2024-2026 — USD 19.28/kW-mes"
  faq:
    - q: "¿Cuánta energía produce Itaipú y cuánto le corresponde a Paraguay?"
      a: "Itaipú tiene 14.000 MW de capacidad total (7.000 MW para cada país). Paraguay consume ~2.500 MW y exporta el excedente a Brasil."
    - q: "¿Cuándo vence el acuerdo tarifario de Itaipú?"
      a: "El acuerdo tarifario vigente (USD 19.28/kW-mes) vence el 31 de diciembre de 2026. El Anexo C del Tratado vence el 1 de enero de 2027."
    - q: "¿Cuánto ingresa Paraguay por Itaipú?"
      a: "Paraguay percibe aproximadamente USD 1.250 millones/año por regalías, inversión social, compensación por cesión de energía y utilidades de capital."


- slug: yacyreta
  name: Yacyretá
  name_full: Entidad Binacional Yacyretá
  description: >
    La Entidad Binacional Yacyretá (EBY), creada con Argentina en 1973, es la
    segunda mayor hidroeléctrica de Paraguay. Aporta alrededor de 1.550 MW al
    sistema paraguayo (18% de la capacidad instalada) y cerca del 11% de la
    generación de la matriz. Junto con Itaipú concentra el 97% de la capacidad
    hidroeléctrica del país en la cuenca del Paraná. Su serie de generación
    histórica se publica en MuchoTexto Data.
  category: infraestructura
  featured: true
  datos_url: "https://datospublicos.muchotexto.net/yacyreta.html"
  datos_desc: "Generación binacional Paraguay-Argentina: mensual EBY y agregada anual"
  related_laws:
    - "Tratado de Yacyretá (1973) — entidad binacional Paraguay-Argentina"
  faq:
    - q: "¿Cuánta energía produce Yacyretá?"
      a: "Yacyretá tiene ~3.100 MW de capacidad total, de los cuales ~1.550 MW corresponden a Paraguay. Es la segunda hidroeléctrica del país después de Itaipú."
    - q: "¿Cuál es la tarifa de Yacyretá?"
      a: "La tarifa de Yacyretá pasó de 22.60 a 28 USD/kW-mes en el acuerdo 2024-2026, aumentando los costos de generación de ANDE."


- slug: yguazu-digital
  name: Yguazú Digital
  name_full: Proyecto Yguazú Digital
  description: >
    Proyecto binacional Paraguay-Taiwán para construir uno de los centros de datos
    de IA más grandes del mundo. Tres fases: Fase I (10 MW, USD 200-500M), Fase II
    (100 MW, ~USD 5B), Fase III (1 GW, ~USD 40B). El ICDF contactó a Google,
    Microsoft y Amazon como posibles clientes. Es el ancla de la estrategia de
    Paraguay como hub de IA.
  category: infraestructura
  featured: true
  faq:
    - q: "¿Qué es Yguazú Digital y cuánta energía consumirá?"
      a: "Yguazú Digital es un proyecto de data center de IA en Paraguay firmado en mayo de 2026 con Taiwán, con 3 fases: 10 MW → 100 MW → 1.000 MW. Consumirá el equivalente a una turbina y media de Itaipú."
    - q: "¿Es Yguazú Digital un proyecto vinculante?"
      a: "No. El memorando de entendimiento firmado en mayo de 2026 es una declaración de intención no vinculante. Las cifras son aspiracionales, no capacidad construida."
    - q: "¿Dónde se ubicará Yguazú Digital?"
      a: "En la zona de Yguazú, departamento de Alto Paraná, cerca de la subestación de ANDE que sirve a la región."


- slug: taiwan
  name: Taiwán
  name_full: Taiwán (República de China)
  description: >
    Taiwán es el último aliado diplomático de Paraguay en Sudamérica y su socio
    estratégico en tecnología. Fabrica el 90% de los semiconductores avanzados del
    mundo (TSMC). Invierte en Paraguay a través del ICDF con becas, cooperación
    técnica y el proyecto Yguazú Digital. En agosto 2026 el fabricante de memorias
    ADATA (2º productor mundial de módulos DRAM) inició la prospección de una
    planta de ensamblaje de memorias y SSDs en Minga Guazú bajo el régimen de
    maquila (Ley 7547/2025). La relación Taiwán-Paraguay define la posición
    geopolítica del país en la guerra fría tecnológica entre China y EE.UU.
  category: geopolítica
  featured: true
  faq:
    - q: "¿Qué acuerdos tiene Taiwán con Paraguay en tecnología?"
      a: "Taiwán firmó un memorando de entendimiento con Paraguay en mayo de 2026 para crear Yguazú Digital, un proyecto de data center de IA de hasta 1.000 MW."
    - q: "¿Por qué Taiwán invierte en Paraguay?"
      a: "Paraguay es el único país de Sudamérica que mantiene relaciones diplomáticas con Taiwán. El acuerdo busca aprovechar la energía barata y abundante de Paraguay para infraestructura de IA."


- slug: cert-py
  name: CERT-PY
  name_full: Centro de Respuesta a Incidentes de Seguridad Informática de Paraguay
  description: >
    Centro nacional de respuesta a incidentes de ciberseguridad, operativo desde
    2012 bajo el MITIC. Coordina la respuesta a ataques informáticos contra
    infraestructura estatal. En 2024 hackers chinos infiltraron sistemas del
    gobierno. En junio 2025 un ransomware paralizó 18 agencias estatales.
  category: gobierno
  related_laws:
    - "Estrategia Nacional de Ciberseguridad 2025-2028 — Decreto 3900"
  manual_articles:
    - title: "Los agentes de IA actuaron sin control y Paraguay no tiene defensas"
      url: /articulos/2026/09/03/contenido-basura-agentes-ia/
      context: "El artículo analiza la respuesta institucional ante agentes autónomos y contenido sintético; CERT-PY opera desde 2012 bajo el MITIC."
  faq:
    - q: "¿Qué es CERT-PY?"
      a: "CERT-PY es el Equipo de Respuesta a Incidentes de Seguridad Informática de Paraguay, dependiente del MITIC, encargado de coordinar la respuesta a ciberincidentes."


- slug: hive-digital
  name: HIVE Digital Technologies
  name_full: HIVE Digital Technologies Ltd.
  description: >
    Empresa de infraestructura digital listada en NASDAQ (HIVE). Opera 300 MW en
    Paraguay (200 MW Yguazú + 100 MW Valenzuela, fases completadas jun-nov 2025)
    y construye 100 MW adicionales de infraestructura en Yguazú, capacidad sin
    asignar entre minería, AI y HPC (energización prevista Q4 2026; Tier-III H2
    2027). Plan total: 400 MW. Los PPAs de Yguazú y Valenzuela vencen el
    31-dic-2027. Modelo dual: minería Bitcoin (93.5% revenue FY2026) + HPC/AI
    cloud. Lanzó BUZZ AI Cloud en marzo 2026 en data center Tier III en Asunción.
  category: empresa
  faq:
    - q: "¿Cuánta capacidad operativa tiene HIVE en Paraguay?"
      a: "HIVE opera ~300 MW en Paraguay (Yguazú Fases 1-2 y Valenzuela), con una expansión de 100 MW de infraestructura en construcción en Yguazú."
    - q: "¿HIVE migra de minería a IA?"
      a: "No es una migración sino un modelo dual: minería Bitcoin representó el 93.5% del revenue en FY2026, mientras HPC/AI cloud aportó el 6.5%."
    - q: "¿Dónde está el data center de HIVE en Paraguay?"
      a: "HIVE opera en Yguazú (Alto Paraná) y Valenzuela (Central), con sede operativa en San Antonio, Texas. Listada en TSX (Canadá) y Nasdaq."


- slug: starlink
  name: Starlink
  name_full: Starlink (SpaceX)
  description: >
    Servicio de internet satelital de SpaceX que opera en Paraguay desde 2023.
    Más de 20.000 usuarios, 1.600 antenas instaladas en escuelas rurales,
    50.000 estudiantes y docentes alcanzados. CONATEL autorizó a Starlink a
    operar por encima de los límites de potencia de la UIT — Paraguay fue el
    primer país del mundo en hacerlo.
  category: empresa
  faq:
    - q: "¿Starlink opera en Paraguay?"
      a: "Starlink (SpaceX) ofrece servicio de internet satelital en Paraguay, proporcionando conectividad en zonas rurales y remotas donde la fibra óptica no llega."
    - q: "¿Cuál es la velocidad de Starlink en Paraguay?"
      a: "Starlink ofrece velocidades de descarga de 50-200 Mbps y latencia de 20-40 ms en Paraguay, dependiendo de la ubicación y congestión de la red."


- slug: koga
  name: KOGA Impact Lab
  name_full: KOGA Impact Lab
  description: >
    Aceleradora y hub de innovación con más de 14 años operando en Paraguay.
    Apoyó a 200+ startups y capacitó a 10.000+ emprendedores. Es el punto de
    encuentro del ecosistema emprendedor tech en Paraguay y un actor clave en
    la formación de talento para la economía digital. Su modelo combina
    aceleración, coworking y programas corporativos con empresas como Samsung,
    Tigo y Coca-Cola. No es un fondo de capital riesgo ni un regulador: su rol
    es formar equipos, conectar founders y dar estructura a las primeras
    etapas. Su límite es la escala: no reemplaza la inversión privada ni la
    política pública de talento.
  category: comunidad
  faq:
    - q: "¿Qué es KOGA?"
      a: "KOGA es una comunidad de tecnología y emprendimiento en Paraguay que organiza eventos, hackathons y programas de formación en IA y desarrollo de software."


- slug: x8cloud
  name: X8 Cloud
  name_full: X8 Cloud
  description: >
    Empresa con sede en Los Ángeles que anunció un plan de USD 10-50B a 30 años
    para construir data centers de IA en Paraguay. Inició construcción en mayo
    de 2026 con 50 MW iniciales. Uno de los primeros actores privados habilitados
    por la apertura del sector eléctrico (Ley 7599, Decreto 6034). Sus anuncios
    deben leerse como proyectos: no hay contrato público verificado con ANDE ni
    un cronograma de fases auditado. Su relevancia es que representa al inversor
    privado que llega con la apertura eléctrica; su riesgo es que la promesa de
    capacidad se confunda con capacidad construida.
  category: empresa
  faq:
    - q: "¿Qué es X8Cloud?"
      a: "X8Cloud es una empresa paraguaya de infraestructura cloud y servicios de tecnología, parte del ecosistema de data centers en crecimiento del país."


- slug: araico
  name: ARAICO
  name_full: ARAICO (Iguazú AI City)
  description: >
    Empresa privada incorporada en Estados Unidos, fundada por los paraguayos
    Alejandro Zuccolillo (presidente) y Nicolás Arréllaga (CEO). Desarrolla
    Iguazú AI City, un campus de data centers de IA de hasta 1,3 GW en Yguazú,
    Alto Paraná, con una inversión anunciada de hasta USD 12.000 millones en
    tres etapas. Su primera fase (6 MW) tiene entrega prevista para diciembre
    de 2026.
  category: empresa
  related_laws:
    - "Ley 7599/2025 y Decreto 6034/2026 — apertura del sector eléctrico"
  faq:
    - q: "¿Qué es Araico y cuánta energía consumirá?"
      a: "Araico firmó un contrato de 15 años con ANDE por hasta 286 MW para un data center. Arranca el 1 de diciembre de 2026 con 6 MW en 23 kV."
    - q: "¿Cuándo estará operativo el data center de Araico?"
      a: "El proyecto arranca el 1 de diciembre de 2026 con 6 MW en 23 kV (56.39 USD/MWh). La capacidad completa de 286 MW se alcanzará en abril de 2029 (48.91 USD/MWh en 220 kV)."


- slug: peter-thiel
  name: Peter Thiel
  name_full: Peter Thiel
  description: >
    Cofundador de PayPal, Palantir Technologies y Founders Fund. Se reunió con
    el presidente Santiago Peña en Mburuvicha Róga el 13 de mayo de 2026,
    generando debate sobre vigilancia, datos y soberanía digital en Paraguay.
    Su interés en el país es un indicador del potencial geopolítico y económico
    de Paraguay en la economía de la IA. La visita fue exploratoria: no anunció
    una inversión directa ni un proyecto propio en el país. El interés se
    explica por la energía barata de Itaipú y por el plan Yguazú Digital; el
    debate local se centra en el historial de Palantir en vigilancia y en qué
    condiciones se usarían datos paraguayos.
  category: geopolítica
  faq:
    - q: "¿Peter Thiel tiene inversiones en Paraguay?"
      a: "Peter Thiel, cofundador de PayPal, ha expresado interés en Paraguay como jurisdicción para experimentos de gobernanza y tecnología, aunque no hay inversiones confirmadas a gran escala."


- slug: santiago-pena
  name: Santiago Peña
  name_full: Santiago Peña Palacios
  description: >
    Expresidente de Paraguay. Asumió el 15 de agosto de 2023 y fue destituido
    por el Senado el 6 de noviembre de 2026 por mal desempeño en el caso Ueno
    Bank; lo reemplazó Pedro Alliana. Antes fue ministro de Hacienda
    (2015-2018). Su gobierno impulsó la apertura del sector eléctrico (Ley
    7599, Decreto 6034), promovió Yguazú Digital con Taiwán y buscó atraer data
    centers. Desde el 7 de noviembre de 2026 cumple prisión preventiva; según
    la Fiscalía, está imputado por lesión de confianza, administración en
    provecho propio y asociación criminal. Niega los cargos y no hay condena.
    La causa investiga el colapso de Ueno Bank, del que fue accionista hasta
    2025. Paraguay sigue sin una estrategia nacional de IA aprobada.
  category: gobierno
  manual_articles:
    - title: "Qué datos tuyos tenía Ueno y qué pasa con ellos ahora"
      url: /articulos/2026/11/13/que-datos-tuyos-tenia-ueno/
      context: "El colapso de Ueno Bank desencadenó el juicio político y la prisión preventiva de Santiago Peña. El artículo documenta qué datos acumuló el banco y qué pasó con ellos tras la resolución."
  faq:
    - q: "¿Qué políticas de energía e IA impulsó Santiago Peña?"
      a: "Peña impulsó la Ley 7599/2025 (apertura del sector eléctrico), el Decreto 6034/2026 (6 fuentes renovables) y la Resolución 52552/2026 (tarifa IA). Convocó la Mesa Energética Nacional en agosto de 2026."
    - q: "¿Qué es la Mesa Energética Nacional?"
      a: "Organismo asesor creado en 2012, reactivado en 2023 por Peña. En agosto de 2026 dio 30 días para propuestas en 4 ejes: institucionalidad, generación, mesa eléctrica público-privada y reglas para inversores."


- slug: bid
  name: BID
  name_full: Banco Interamericano de Desarrollo
  description: >
    Organismo multilateral que financió la Agenda Digital de Paraguay con un
    préstamo de USD 130M (2019) y la Estrategia Nacional de Hidrógeno Verde
    (2025). Socio financiero recurrente en infraestructura digital y energética
    del país. El Data Center Estatal Tier III del MITIC también fue financiado
    por el BID.
  category: geopolítica
  faq:
    - q: "¿Qué financiamiento aporta el BID a Paraguay en tecnología?"
      a: "El BID financió con USD 130 millones la Red Nacional de Fibra Óptica (2019), que unificó las redes de Copaco, ANDE, Interior, Hacienda y MITIC."
    - q: "¿El BID participa en la política energética de Paraguay?"
      a: "El BID apoyó el estudio Ceare (UBA) sobre tarifas de ANDE 2026-2030, que proyecta un aumento del 39.4% en la tarifa media para 2030."


- slug: tsmc
  name: TSMC
  name_full: Taiwan Semiconductor Manufacturing Company
  description: >
    El mayor fabricante de semiconductores del mundo. Produce la mayor parte de
    los chips avanzados utilizados en IA (NVIDIA H100, Apple M-series, etc.).
    Aunque no fabrica en Paraguay, delegados de TSMC han participado en foros
    bilaterales Paraguay-Taiwán. Su relación con Taiwán es clave para entender
    la geopolítica de los chips. Es una fundición: fabrica chips diseñados por
    otras empresas y no vende chips con marca propia. Su capacidad en nodos
    avanzados está concentrada en Taiwán, lo que convierte a la isla en un punto
    crítico de la cadena global de IA. Para Paraguay, su relevancia es
    geopolítica: explica por qué Taiwán es un socio estratégico y por qué la
    relación con China condiciona la agenda tecnológica.
  category: geopolítica
  faq:
    - q: "¿TSMC tiene presencia en Paraguay?"
      a: "TSMC (Taiwan Semiconductor Manufacturing Company) no tiene operaciones en Paraguay, pero es un actor clave en la geopolítica de semiconductores que afecta la cadena de suministro global de chips para IA."


- slug: sopaia
  name: SOPAIA
  name_full: Sociedad Paraguaya de Inteligencia Artificial
  description: >
    Organización que reúne a profesionales, investigadores y entusiastas de la
    IA en Paraguay. Promueve el desarrollo y la divulgación de la inteligencia
    artificial en el país. Co-organiza IBERAMIA 2026, la 19ª Conferencia
    Iberoamericana de Inteligencia Artificial a realizarse en Asunción. Fundada
    en 2023, no es una autoridad regulatoria ni un colegio profesional. Su
    aporte es de comunidad y divulgación: conecta talento, organiza actividades
    y acerca casos de IA a empresas y al Estado. IBERAMIA 2026 es su principal
    vidriera regional. También busca articular con universidades, empresas y
    organismos públicos. Su límite es la ausencia de una estrategia nacional de
    IA, que deja la agenda de comunidad sin marco de política. Su agenda incluye
    talleres, charlas, formación y vínculos con el sector productivo y la
    academia.
  category: comunidad
  faq:
    - q: "¿Qué es SOPAIA?"
      a: "SOPAIA es una organización de la sociedad civil paraguaya enfocada en la promoción de la inteligencia artificial y la tecnología en el país."


- slug: pti-py
  name: PTI-PY
  name_full: Parque Tecnológico Itaipú Paraguay
  description: >
    Centro de investigación y desarrollo tecnológico vinculado a Itaipú
    Binacional. Opera la única unidad experimental de hidrógeno verde del
    Paraguay (2 Nm³/h). Desarrolla proyectos de innovación en energía,
    automatización y tecnología aplicada. Actor clave en la transición
    energética y la diversificación tecnológica del país. Su sede operativa
    está vinculada a Itaipú y su unidad de hidrógeno verde produce 2 Nm³/h, una
    escala de investigación, no industrial. También trabaja en automatización,
    robótica y formación técnica. Su importancia es doble: es un puente entre
    la energía de Itaipú y la diversificación tecnológica, y un socio posible
    para pilotos de IA aplicada en la región este.
  category: academia
  faq:
    - q: "¿Qué es el PTI-PY?"
      a: "El PTI-PY (Parque Tecnológico de la Información) es un espacio de innovación y tecnología en Paraguay que alberga empresas, startups y programas de formación."


- slug: universidad-nacional
  name: UNA
  name_full: Universidad Nacional de Asunción
  description: >
    La universidad más grande de Paraguay, fundada en 1889. Sus facultades de
    Ingeniería y Politécnica forman parte de los ~400 graduados anuales en
    informática. Co-organiza IBERAMIA 2026 junto a UCA, UCOM y SOPAIA.
    Representa la capacidad de formación de talento tech del país.
  category: academia
  faq:
    - q: "¿Qué rol tiene la Universidad Nacional en IA?"
      a: "La Universidad Nacional de Asunción (UNA) es la principal institución académica de Paraguay, con facultades de ingeniería y ciencias que forman profesionales en tecnología e IA."


- slug: amcham
  name: AmCham Paraguay
  name_full: Cámara de Comercio Paraguayo-Americana
  description: >
    Cámara binacional que impulsó foros internacionales para posicionar a
    Paraguay como hub de data centers, energía limpia e IA. Organizó el foro
    en Silicon Valley (junio 2026) con el MIC, conectando el ecosistema tech
    paraguayo con inversores y empresas estadounidenses. Su función es de
    articulación comercial e institucional: no opera infraestructura ni regula
    el sector. En el debate de IA, su valor está en abrir puertas entre
    empresas paraguayas, inversores estadounidenses y el sector público, y en
    traducir prioridades de política a agendas de negocios. También organiza
    misiones, encuentros y espacios de networking para sus socios. No es un
    fondo de inversión ni una entidad técnica; su influencia depende de la
    agenda de sus miembros y de su capacidad de convocar a decisores públicos.
  category: comunidad
  faq:
    - q: "¿Qué es AmCham Paraguay?"
      a: "AmCham Paraguay es la Cámara de Comercio Paraguayo-Americana, que promueve el comercio, la inversión y el diálogo entre empresas paraguayas y estadounidenses."


- slug: conatel
  name: Conatel
  name_full: Comisión Nacional de Telecomunicaciones
  description: >
    Organismo regulador de las telecomunicaciones de Paraguay. Administra el
    espectro radioeléctrico y adjudicó las licitaciones de 5G: la primera en
    2025 (Claro y Nubicom) y la segunda en 2026 (Tigo y Personal). Regula la
    conectividad del país, una de las patas del hub digital paraguayo.
  category: gobierno
  faq:
    - q: "¿Qué regula CONATEL en Paraguay?"
      a: "CONATEL (Comisión Nacional de Telecomunicaciones) regula las telecomunicaciones, incluyendo el espectro radioeléctrico, la calidad de servicio y la conectividad."


- slug: tigo
  name: Tigo
  name_full: Tigo Paraguay (Telecel S.A.E.)
  description: >
    El mayor operador de telecomunicaciones de Paraguay. Opera el único data
    center Tier III de un operador privado (Villa Elisa, desde 2016, sobre el
    que corre BUZZ AI Cloud de HIVE) y ganó espectro 5G en 2.300-2.400 MHz en
    la segunda licitación (2026). Actor clave de la conectividad y la
    infraestructura digital del país.
  category: empresa
  faq:
    - q: "¿Tigo tiene un data center Tier III en Paraguay?"
      a: "Sí. Tigo opera un data center Tier III en Villa Elisa, donde HIVE lanzó BUZZ AI Cloud en marzo de 2026. Es una de las dos certificaciones Uptime Tier III vigentes en Paraguay (junto a Itaipú)."


- slug: bcp
  name: BCP
  name_full: Banco Central del Paraguay
  description: >
    Autoridad monetaria de Paraguay y operador del SIPAP/SIP, el sistema de
    pagos del país. Su módulo de pagos instantáneos (SPI) movió en 2025 el
    equivalente a más de tres veces el PIB. En 2026 lanzó el QR Hub
    interoperable y una hoja de ruta para expandir los pagos a comercios,
    impuestos e integración regional con Pix de Brasil.
  category: gobierno
  manual_articles:
    - title: "Qué datos tuyos tenía Ueno y qué pasa con ellos ahora"
      url: /articulos/2026/11/13/que-datos-tuyos-tenia-ueno/
      context: "El BCP dispuso la resolución de ueno bank el 2-nov-2026 y pagó el anticipo del FGD; la ley de resolución no menciona datos personales."
    - title: "Paraguay tiene más fintechs que bancos y recién empieza"
      url: /articulos/2026/07/10/fintech-paraguay-ecosistema/
      context: "La Ley 7503/2025 creó el Sistema Nacional de Pagos y extendió la supervisión del BCP a las fintech; el artículo analiza el ecosistema y sus límites."
  faq:
    - q: "¿Qué es el BCP y su rol en pagos digitales?"
      a: "El Banco Central del Paraguay (BCP) gestiona el Sistema de Pagos Instantáneos (SPI) con 382 millones de operaciones en 2025 y lanzó el QR Hub para pagos interoperables."
    - q: "¿Qué es el QR Hub del BCP?"
      a: "El QR Hub es una plataforma centralizada del BCP que permite pagos por transferencia directa entre cuentas, con tope del 1.5% IVA incluido y límite de G. 10 millones."


- slug: bancard
  name: Bancard
  name_full: Bancard S.A.
  description: >
    Procesadora de pagos paraguaya que desarrolló el estándar PY-QR de pagos
    con código QR (basado en EMV QRCPS). Permite a los comercios paraguayos
    cobrar con Pix de Brasil desde 2024, anticipando la integración
    transfronteriza que los bancos centrales aún negocian.
  category: empresa
  manual_articles:
    - title: "Paraguay tiene más fintechs que bancos y recién empieza"
      url: /articulos/2026/07/10/fintech-paraguay-ecosistema/
      context: "Bancard es el procesador dominante de pagos digitales en Paraguay, con POS, QR, vPOS y Tokefon; el artículo analiza su rol en el ecosistema fintech."
  faq:
    - q: "¿Qué es Bancard y su red PY-QR?"
      a: "Bancard opera la red privada PY-QR con 181.000 comercios, 75+ aplicaciones (bancos, financieras, cooperativas y billeteras) y 68.1% de los pagos electrónicos de su red."


- slug: migraciones
  name: Migraciones
  name_full: Dirección General de Migraciones
  description: >
    Autoridad migratoria de Paraguay. Concede la residencia permanente y aplica
    la Ley 6984/2022. El artículo 46 de esa ley es la base de la residencia
    permanente por inversión que promociona el Investor Pass; Migraciones
    registró 47.687 solicitudes y otorgó 40.600 residencias en 2025.
  category: gobierno
  related_laws:
    - "Ley 6984/2022 - Migraciones, art. 46 residencia permanente por inversión"
    - "Resolución MIC 0283/2026 - Constancia de Inversionista Extranjero"
  manual_articles:
    - title: "Paraguay firma la residencia permanente más directa de la región"
      url: /articulos/2026/09/25/paraguay-investor-pass-residencia-inversores/
      context: "La Resolución MIC 0283/2026 reglamenta la Constancia de Inversionista Extranjero; la residencia permanente la concede Migraciones al amparo del artículo 46 de la Ley 6984/2022."
  faq:
    - q: "¿La Dirección de Migraciones ofrece trámites digitales?"
      a: "La Dirección General de Migraciones de Paraguay ofrece trámites en línea a través de Paraguay.gov.py, incluyendo consultas de estado migratorio y solicitud de documentos."


- slug: ministerio-energia
  name: Ministerio de Energía
  name_full: Ministerio de Energía, Minería e Hidrocarburos
  description: >
    Ministerio propuesto por el Ejecutivo el 13 de agosto de 2026. El proyecto
    de ley de 27 artículos crea tres viceministerios (Energía, Minería e
    Hidrocarburos) y absorbería al Viceministerio de Minas y Energía (MOPC) y a
    la Dirección de Combustibles (MIC). Es un proyecto en debate, no una
    institución creada.
  category: gobierno
  related_laws:
    - "Proyecto de ley de creación del Ministerio de Energía, Minería e Hidrocarburos (2026)"
    - "Ley 7599/2025 y Decreto 6034/2026 - apertura del sector eléctrico"
  manual_articles:
    - title: "El ministerio de energía que Paraguay prepara con tres viceministerios"
      url: /articulos/2026/08/19/ministerio-energia-mineria-hidrocarburos/
      context: "El proyecto crea el Ministerio de Energía, Minería e Hidrocarburos con tres viceministerios y absorbería al VMME y a la Dirección de Combustibles."
    - title: "El modelo institucional de PSR para el sector eléctrico paraguayo"
      url: /articulos/2026/08/19/modelo-institucional-psr-sector-electrico/
      context: "El documento de PSR diagnostica funciones mezcladas entre VMME y ANDE y propone separarlas en ministerio, regulador y empresa."
    - title: "El ente regulador de energía que Paraguay diseña con concurso público"
      url: /articulos/2026/08/19/ente-regulador-energia/
      context: "El proyecto de ley del Ejecutivo crea un ente regulador de energía con concurso público, en paralelo al nuevo ministerio."
  faq:
    - q: "¿Existe el Ministerio de Energía en Paraguay?"
      a: "No. Es un proyecto de ley presentado en agosto de 2026 que crearía el 'Ministerio de Energía, Minería e Hidrocarburos' con 3 viceministerios. Actualmente solo existe el Viceministerio de Minas y Energía (VMME) dentro del MOPC."

