# Entidades clave del Observatorio de IA en Paraguay
# Lista curada manualmente. build_entities.py escanea _posts/ para
# encontrar articulos relacionados y regenera las paginas de entidad.
#
# Los textos DEBEN usar acentos y caracteres del espanol correctamente.

- slug: mitic
  name: MITIC
  name_full: Ministerio de Tecnologías de la Información y Comunicación
  description: >
    Creado en 2018 por la Ley 6207, el MITIC es el ministerio responsable de la
    política digital de Paraguay. Administra la identidad electrónica (1,5M+
    usuarios), más de 480 trámites y servicios del portal Paraguay.gov.py y la
    infraestructura de datos del Estado. Es la contraparte del BID en la Agenda
    Digital y participó con CONACYT en la consulta pública de 2024 para la hoja
    de ruta de IA; la Estrategia Nacional de IA sigue sin aprobación formal.
  category: gobierno
  featured: true
  related_laws:
    - "Ley 6822/2022 — servicios de confianza electrónica"
    - "Ley 7593/2025 — protección de datos personales"
  faq:
    - q: "¿Qué es el MITIC y cuándo se creó?"
      a: "El MITIC (Ministerio de Tecnologías de la Información y Comunicación) se creó en 2018 por la Ley 6207 y es responsable de la política digital de Paraguay, incluyendo identidad electrónica y trámites y servicios digitales. Participa con CONACYT en el desarrollo de la Estrategia Nacional de IA, aún no aprobada."
    - q: "¿Cuántos trámites digitales ofrece Paraguay.gov.py?"
      a: "El portal Paraguay.gov.py ofrece más de 480 trámites y servicios digitales, con más de 1,5 millones de usuarios registrados con identidad electrónica."
    - q: "¿Paraguay tiene una estrategia nacional de IA?"
      a: "El MITIC participó con CONACYT en la consulta pública de 2024 para insumos de la hoja de ruta de IA. Paraguay no tiene una Estrategia Nacional de IA aprobada formalmente a la fecha."


- slug: ande
  name: ANDE
  name_full: Administración Nacional de Electricidad
  description: >
    La ANDE es la empresa estatal de electricidad de Paraguay. Compra la energía
    de Itaipú y Yacyretá, genera en Acaray (210 MW) y opera las redes de
    transmisión y distribución del país. El sistema paraguayo dispone de unos
    8.760 MW, de los que 7.000 MW corresponden a la parte de Itaipú asignada a
    Paraguay. Es el principal proveedor de energía para data centers y
    criptominería, y aplica la nueva reglamentación de renovables no
    convencionales no hidráulicas (Ley 7599/2025 y Decreto 6034/2026).
  category: infraestructura
  featured: true
  datos_url: "https://datospublicos.muchotexto.net/energia.html"
  datos_desc: "sistema eléctrico paraguayo: consumo, demanda, pérdidas, clientes y tarifas"
  related_laws:
    - "Ley 7599/2025 y Decreto 6034/2026 — marco para renovables no convencionales no hidráulicas"
    - "Ley 7547/2025 — reforma de la Ley de Maquila, incluye servicios intangibles"
    - "Tarifa de Itaipú 2024-2026 — USD 19.28/kW-mes, venta de excedente al mercado brasileño"
    - "Acuerdo tarifario de Itaipú 2024-2026 — vence 31 de diciembre de 2026"
  manual_articles:
    - title: "La energía nuclear que Paraguay firmó con EE.UU. no es un reactor"
      url: /articulos/2026/09/23/energia-nuclear-paraguay-eeuu/
      context: "El MOU nuclear con EE.UU. no es un Acuerdo 123 ni una promesa de reactor; ANDE y MOPC participaron del recorrido institucional previo."
    - title: "El Estado ya puede comprar I+D, pero no es una venta segura"
      url: /articulos/2026/11/16/compra-publica-innovacion-paraguay/
      context: "ANDE es uno de los dos pilotos de Compra Pública de Innovación: el reto Energía Segura busca reducir pérdidas eléctricas no técnicas en baja tensión en una zona crítica de Luque."
  faq:
    - q: "¿Cuánta energía genera Paraguay y cuánto consume?"
      a: "Paraguay genera aproximadamente 44 TWh/año. El consumo nacional fue de 29.419 GWh (29,4 TWh) en 2025, según la memoria anual de ANDE, y el excedente se exporta a Brasil y Argentina."
    - q: "¿Cuál es la tarifa de ANDE para data centers de IA?"
      a: "La Resolución 52552/2026 establece una tarifa media de 48.91 USD/MWh en 220 kV y 56.39 USD/MWh en 23 kV, con ajuste anual por CPI+PPI y piso del 2.5%."
    - q: "¿Qué porcentaje de la energía paraguaya es renovable?"
      a: "Prácticamente toda la electricidad que consume Paraguay es de origen hidroeléctrico. En 2025, Itaipú aportó el 87.6%, Yacyretá el 10.5% y Acaray el 1.9% del consumo nacional, según la memoria anual de ANDE. No hay parques solares ni eólicos utility-scale en operación."
    - q: "¿Cuánta potencia reservada tienen las empresas intensivas en energía?"
      a: "En marzo de 2026, un listado entregado por ANDE registraba 41 suministros activos del GCIE con 943.882 kW (943.8 MW) de potencia reservada, equivalente al 13.5% de los 7.000 MW de Itaipú asignados a Paraguay. Desde la Res. 52552/2026, IA/nube/HPC se contabilizan aparte."


- slug: itaipu
  name: Itaipú
  name_full: Itaipú Binacional
  description: >
    La mayor generadora de energía limpia y renovable del mundo por producción
    acumulada, creada por el Tratado de 1973, en operación desde mayo de 1984 y
    operada por Paraguay y Brasil. Genera 14.000 MW (7.000 MW para cada país);
    en 2025 suministró 25.768 GWh a Paraguay, el 87,6% del consumo eléctrico
    nacional, y cede el excedente de la cuota paraguaya a Brasil. Históricamente,
    entre 1984 y 2025 el aprovechamiento acumulado de esa cuota fue del 20,3%.
    El acuerdo tarifario 2024-2026 vence el 31 de diciembre de 2026; la revisión
    del Anexo C se reanudó en noviembre de 2025.
    La energía de Itaipú alimenta los data centers de HIVE y, según los propios
    inversores, es una de las ventajas competitivas de Paraguay en la economía
    de la IA.
  category: infraestructura
  featured: true
  datos_url: "https://datospublicos.muchotexto.net/itaipu.html"
  datos_desc: "serie 2000–2026: generación por sector 50/60 Hz y suministro a Paraguay y Brasil"
  related_laws:
    - "Acuerdo tarifario de Itaipú 2024-2026 — vence 31 de diciembre de 2026"
    - "Tarifa Itaipú 2024-2026 — USD 19.28/kW-mes"
  faq:
    - q: "¿Cuánta energía produce Itaipú y cuánto le corresponde a Paraguay?"
      a: "Itaipú tiene 14.000 MW de capacidad total (7.000 MW para cada país). En 2025 suministró 25.768 GWh a Paraguay, el 87,6% del consumo eléctrico nacional; el resto de la cuota paraguaya se cede a Brasil."
    - q: "¿Cuándo vence el acuerdo tarifario de Itaipú?"
      a: "El acuerdo tarifario vigente (USD 19.28/kW-mes) vence el 31 de diciembre de 2026. La revisión del Anexo C se reanudó en noviembre de 2025, pero no hay un nuevo texto firmado."
    - q: "¿Cuánto ingresa Paraguay por Itaipú?"
      a: "El anuncio oficial del 9 de mayo de 2024 proyectó USD 1.250 millones/año (280 regalías + 650 inversión social + 265 compensación por cesión + 53 utilidades) para el acuerdo 2024-2026; lo efectivamente percibido en 2024 fue de USD 880,9 millones."


- slug: yacyreta
  name: Yacyretá
  name_full: Entidad Binacional Yacyretá
  description: >
    La Entidad Binacional Yacyretá (EBY), creada con Argentina en 1973, es la
    segunda mayor hidroeléctrica de Paraguay. Aporta alrededor de 1.550 MW al
    sistema paraguayo (18% de la capacidad instalada) y cerca del 10,5% de la
    generación de la matriz en 2025. Junto con Itaipú concentra el 97% de la capacidad
    hidroeléctrica del país en la cuenca del Paraná. Su serie de generación
    histórica se publica en MuchoTexto Data.
  category: infraestructura
  featured: true
  datos_url: "https://datospublicos.muchotexto.net/yacyreta.html"
  datos_desc: "Generación binacional Paraguay-Argentina: mensual EBY y agregada anual"
  related_laws:
    - "Tratado de Yacyretá (1973) — entidad binacional Paraguay-Argentina"
  faq:
    - q: "¿Cuánta energía produce Yacyretá?"
      a: "Yacyretá tiene ~3.100 MW de capacidad total, de los cuales ~1.550 MW corresponden a Paraguay. Es la segunda hidroeléctrica del país después de Itaipú."
    - q: "¿Cuál es la tarifa de Yacyretá?"
      a: "El acta acuerdo de mayo de 2025 elevó el precio de la energía de Yacyretá de USD 22,63 a USD 28 por MWh, con revisiones anuales hasta 2029. ANDE anunció que no trasladaría el aumento a sus clientes, aunque su costo medio de generación subió a unos USD 28/MWh."
    - q: "¿Cuánta energía suministró Yacyretá a Paraguay en 2025?"
      a: "La capa de datos públicos registra 3.081 GWh suministrados a Paraguay en 2025, frente a 16.103 GWh de generación total de la entidad."


- slug: yguazu-digital
  name: Yguazú Digital
  name_full: Proyecto Yguazú Digital
  description: >
    Proyecto binacional Paraguay-Taiwán para construir un centro de datos de IA,
    uno de los proyectos anunciados más grandes de la región. Tres fases: 10 MW
    (financiamiento taiwanés anunciado de USD 200 millones), 100 MW y hasta
    1 GW; las fases posteriores son metas declaradas sin costos verificados.
    El ICDF contactó a Google, Microsoft y Amazon para evaluar su interés en
    invertir. El MITIC lo describe como una de las iniciativas estratégicas de
    la alianza entre ambos países.
  category: infraestructura
  featured: true
  faq:
    - q: "¿Qué es Yguazú Digital y cuánta energía consumirá?"
      a: "Yguazú Digital es un proyecto de data center de IA en Paraguay firmado en mayo de 2026 con Taiwán, con 3 fases: 10 MW → 100 MW → 1.000 MW. Consumirá casi el equivalente a una unidad y media de Itaipú."
    - q: "¿Es Yguazú Digital un proyecto vinculante?"
      a: "No. El memorando de entendimiento firmado en mayo de 2026 es una declaración de intención no vinculante. Las cifras son aspiracionales, no capacidad construida."
    - q: "¿Dónde se ubicará Yguazú Digital?"
      a: "En la zona de Yguazú, departamento de Alto Paraná."


- slug: taiwan
  name: Taiwán
  name_full: Taiwán (República de China)
  description: >
    Taiwán es el último aliado diplomático de Paraguay en Sudamérica y su socio
    estratégico en tecnología. TSMC fabrica más del 90% de los chips más
    avanzados del mundo. Coopera técnicamente con Paraguay mediante el ICDF;
    el ICDF y el MITIC fueron designados organismos ejecutores de Yguazú
    Digital. En agosto de 2026 ADATA evaluaba instalar una planta en Paraguay,
    con prospección en Minga Guazú, bajo los regímenes de maquila y ensamblaje;
    en 2024 fue segunda por ingresos en módulos DRAM. La alianza con Taiwán es
    un factor relevante en la posición geopolítica del país en la guerra fría
    tecnológica entre China y EE.UU.
  category: geopolítica
  featured: true
  faq:
    - q: "¿Qué acuerdos tiene Taiwán con Paraguay en tecnología?"
      a: "Taiwán firmó un memorando de entendimiento con Paraguay en mayo de 2026 para crear Yguazú Digital, un proyecto de data center de IA de hasta 1.000 MW."
    - q: "¿Por qué Taiwán invierte en Paraguay?"
      a: "Paraguay es el único país de Sudamérica que mantiene relaciones diplomáticas con Taiwán. El acuerdo busca aprovechar la ubicación estratégica y la disponibilidad energética de Paraguay para infraestructura de IA."
    - q: "¿Qué empresas taiwanesas evalúan invertir en Paraguay?"
      a: "En agosto de 2026 ADATA evaluaba instalar una planta de memorias y SSDs en Minga Guazú, bajo los regímenes de maquila y ensamblaje. La prospección no implica una inversión confirmada."
    - q: "¿Taiwán entrega becas a estudiantes paraguayos?"
      a: "La fuente oficial abierta del ICDF verifica cooperación técnica y la designación del ICDF como organismo ejecutor de Yguazú Digital; no documenta un programa de becas para Paraguay."


- slug: cert-py
  name: CERT-PY
  name_full: Centro de Respuesta a Incidentes de Seguridad Informática de Paraguay
  description: >
    Centro nacional de respuesta a incidentes de ciberseguridad, operativo desde
    2012 bajo el MITIC. Coordina la respuesta a ataques informáticos contra
    infraestructura estatal. Un equipo de investigadores paraguayos y
    estadounidenses identificó al grupo Flax Typhoon, vinculado al gobierno
    chino, como responsable de intrusiones en el país, según OCCRP. En mayo de
    2025 cibercriminales infiltraron varios ministerios; en junio un grupo de
    ransomware reclamó un rescate por presuntos datos de ciudadanos, que el
    Gobierno atribuyó a filtraciones previas sin confirmar una intrusión nueva.
  category: gobierno
  related_laws:
    - "Estrategia Nacional de Ciberseguridad 2025-2028 — Decreto 3900"
  manual_articles:
    - title: "Los agentes de IA actuaron sin control y Paraguay no tiene defensas"
      url: /articulos/2026/09/03/contenido-basura-agentes-ia/
      context: "El artículo analiza la respuesta institucional ante agentes autónomos y contenido sintético; CERT-PY opera desde 2012 bajo el MITIC."
  faq:
    - q: "¿Qué es CERT-PY?"
      a: "CERT-PY es el Equipo de Respuesta a Incidentes de Seguridad Informática de Paraguay, dependiente del MITIC, encargado de coordinar la respuesta a ciberincidentes."
    - q: "¿Qué ocurrió con el ransomware de junio de 2025?"
      a: "El ministro Gustavo Villate declaró: «no se trata de un secuestro de información, sino más bien de datos recopilados de filtraciones anteriores». El Gobierno negó haber pagado o negociado con el grupo, sin confirmar una intrusión nueva."
    - q: "¿Qué norma rige la ciberseguridad nacional?"
      a: "El Decreto 3900 oficializó la Estrategia Nacional de Ciberseguridad 2025-2028, según la ficha institucional de CERT-PY."


- slug: hive-digital
  name: HIVE Digital Technologies
  name_full: HIVE Digital Technologies Ltd.
  description: >
    Empresa de infraestructura digital listada en NASDAQ (HIVE). Opera 300 MW en
    Paraguay (200 MW Yguazú + 100 MW Valenzuela, fases completadas jun-nov 2025)
    y construye 100 MW adicionales de infraestructura en Yguazú, capacidad sin
    asignar entre minería, AI y HPC (energización prevista Q4 2026; Tier-III H2
    2027). Plan total: 400 MW. Los PPAs de Yguazú y Valenzuela vencen el
    31-dic-2027. Modelo dual: minería Bitcoin (93.5% revenue FY2026) + HPC/AI
    cloud. Lanzó BUZZ AI Cloud en marzo de 2026 en el data center Tier III de
    Tigo en Villa Elisa, Área Metropolitana de Asunción.
  category: empresa
  faq:
    - q: "¿Cuánta capacidad operativa tiene HIVE en Paraguay?"
      a: "HIVE opera ~300 MW en Paraguay (Yguazú Fases 1-2 y Valenzuela), con una expansión de 100 MW de infraestructura en construcción en Yguazú."
    - q: "¿HIVE migra de minería a IA?"
      a: "No es una migración sino un modelo dual: minería Bitcoin representó el 93.5% del revenue en FY2026, mientras HPC/AI cloud aportó el 6.5%."
    - q: "¿Dónde está el data center de HIVE en Paraguay?"
      a: "HIVE opera en Yguazú (Alto Paraná) y Valenzuela (Cordillera), con sede operativa en San Antonio, Texas. Listada en TSX (Canadá) y Nasdaq."


- slug: starlink
  name: Starlink
  name_full: Starlink (SpaceX)
  description: >
    Servicio de internet satelital de SpaceX que opera en Paraguay desde 2023.
    Alrededor de 20.000 terminales autorizadas; 1.600 kits de conectividad
    incorporados y más de 50.000 estudiantes y docentes alcanzados. CONATEL
    autorizó a Starlink a operar por encima de los límites de potencia de la
    UIT: Paraguay fue uno de los primeros países de la región en hacerlo.
  category: empresa
  faq:
    - q: "¿Starlink opera en Paraguay?"
      a: "Starlink (SpaceX) ofrece servicio de internet satelital en Paraguay, proporcionando conectividad en zonas rurales y remotas donde la fibra óptica no llega."
    - q: "¿Cuál es la velocidad de Starlink en Paraguay?"
      a: "ABC Color reportó en julio de 2026 velocidades cercanas a los 150 Mbps. No hay fuente abierta que verifique el rango de 50-200 Mbps ni una latencia de 20-40 ms."
    - q: "¿Cuándo autorizó CONATEL a Starlink?"
      a: "CONATEL otorgó la licencia a Starlink Paraguay S.R.L. mediante la Resolución de Directorio N.º 2508, del 5 de octubre de 2023."


- slug: koga
  name: KOGA Impact Lab
  name_full: KOGA Impact Lab
  description: >
    Aceleradora y hub de innovación con más de 14 años operando en Paraguay.
    Organiza convocatorias, DemoDays, bootcamps y eventos, y combina programas,
    mentorías y proyectos de impacto con casos como Samsung, Tigo Business y
    Cervepar — Coca-Cola. Para este observatorio es un punto de encuentro del
    ecosistema emprendedor tech: acompaña etapas iniciales, pero no sustituye
    la inversión privada ni la política pública de talento. El texto público de
    su sitio no permite verificar las cifras de startups apoyadas ni de
    emprendedores capacitados.
  category: comunidad
  manual_articles:
    - title: "De la soja al silicio: la matriz exportadora de Paraguay"
      url: /articulos/2026/07/01/de-la-soja-al-silicio-matriz-exportadora-paraguay/
      context: "El artículo ubica a KOGA como laboratorio de innovación con 14 años en Asunción y ejecutor de programas con Samsung, Tigo y Coca-Cola."
    - title: "Startups de IA en Paraguay: inversión, talento y lo que falta"
      url: /articulos/2026/07/14/startups-ia-paraguay/
      context: "El artículo describe a KOGA Impact Lab como aceleradora, espacio de comunidad y actor del ecosistema startup paraguayo."
  faq:
    - q: "¿Qué es KOGA?"
      a: "KOGA es una aceleradora y hub de innovación con más de 14 años en Paraguay. Organiza convocatorias, DemoDays, bootcamps y eventos."
    - q: "¿Con qué empresas trabajó KOGA?"
      a: "Su sitio menciona programas con Samsung (Solve for Tomorrow), Tigo Business (Tigo Conecta) y Cervepar — Coca-Cola (100+labs)."
    - q: "¿Cuántas startups apoyó KOGA?"
      a: "El texto público del sitio de KOGA no permite verificar las cifras de startups apoyadas ni de emprendedores capacitados; por eso no se publican."


- slug: x8cloud
  name: X8 Cloud
  name_full: X8 Cloud
  description: >
    Empresa con sede en Los Ángeles que anunció un plan de USD 10-50B a 30 años
    para construir data centers de IA en Paraguay. Anunció operaciones comerciales
    iniciales de 50 MW para inicios de 2026; al 4 de marzo de 2026 ANDE informó
    al Congreso que solo existía un memorando de entendimiento firmado en
    septiembre de 2025, sin contrato de suministro ni inicio de obra confirmado.
    Ese memorando es anterior a la Ley 7599/2025 y al Decreto 6034/2026: el
    proyecto se enmarca en el debate posterior sobre la apertura del sector.
    Sus anuncios deben leerse como proyectos: no hay contrato público verificado
    con ANDE ni un cronograma de fases auditado. Su riesgo es que la promesa de
    capacidad se confunda con capacidad construida.
  category: empresa
  manual_articles:
    - title: "Lo que el capital de Silicon Valley busca en Paraguay y no encuentra"
      url: /articulos/2026/07/31/silicon-valley-cono-sur-paraguay/
      context: "El artículo verificó que el sitio de X8 Cloud no publica montos de inversión, capacidades en MW ni estado de construcción: las cifras circularon en un comunicado de AccessWire."
    - title: "El experimento paraguayo de Peter Thiel"
      url: /articulos/2026/05/16/peter-thiel-paraguay-experimento/
      context: "X8 Cloud, con sede en Los Ángeles, anunció un plan de USD 10.000 a 50.000 millones para data centers en Paraguay en 30 años, en el marco del interés inversor en la energía paraguaya."
  faq:
    - q: "¿Qué es X8 Cloud?"
      a: "X8 Cloud es una empresa estadounidense con sede en Los Ángeles que anunció un plan de USD 10.000 a 50.000 millones en 30 años para data centers de IA en Paraguay. No es una empresa paraguaya."
    - q: "¿X8 Cloud tiene un contrato de energía con ANDE?"
      a: "No. En marzo de 2026 ANDE informó al Congreso que con LEVIP S.A. / X8 Cloud solo había suscripto un Plan de Acción Conjunta a título de memorando de entendimiento, el 9 de septiembre de 2025, y que no se había firmado un Contrato de Prestación del Servicio de Conexión y Suministro de Energía Eléctrica."
    - q: "¿Qué capacidad anunció X8 Cloud en Paraguay?"
      a: "La empresa promociona 50 MW iniciales, pero un artículo de este sitio verificó que su sitio web no publica montos de inversión, capacidades en MW ni estado de construcción; las cifras circularon en un comunicado de AccessWire, no en la empresa."


- slug: araico
  name: ARAICO
  name_full: ARAICO (Iguazú AI City)
  description: >
    Empresa privada incorporada en Estados Unidos, fundada por los paraguayos
    Alejandro Zuccolillo (presidente) y Nicolás Arréllaga (CEO). Desarrolla
    Iguazú AI City, un campus de data centers de IA de hasta 1,3 GW en Yguazú,
    Alto Paraná, con una inversión anunciada de hasta USD 12.000 millones en
    tres etapas. Su primera fase (6 MW) tiene entrega prevista para diciembre
    de 2026.
  category: empresa
  related_laws:
    - "Ley 7599/2025 y Decreto 6034/2026 — apertura del sector eléctrico"
  faq:
    - q: "¿Qué es Araico y cuánta energía consumirá?"
      a: "Araico firmó un contrato de 15 años con ANDE por hasta 286 MW para un data center. Arranca el 1 de diciembre de 2026 con 6 MW en 23 kV."
    - q: "¿Cuándo estará operativo el data center de Araico?"
      a: "El proyecto arranca el 1 de diciembre de 2026 con 6 MW en 23 kV (56.39 USD/MWh). La capacidad completa de 286 MW se alcanzará en abril de 2029 (48.91 USD/MWh en 220 kV)."
    - q: "¿Qué es Iguazú AI City?"
      a: "Es el campus de data centers de IA promovido por Araico en Yguazú, Alto Paraná, con una inversión anunciada de hasta USD 12.000 millones en tres etapas y una meta de 1,3 GW. Las cifras son anuncios de la empresa, no capacidad construida."
    - q: "¿En qué marco tarifario se firmó el contrato de Araico?"
      a: "El acuerdo se firmó el 22 de octubre de 2026 al amparo de la Resolución ANDE 52552/2026, que creó el grupo de industrias electrointensivas de tecnología avanzada para IA, nube, hiperescala y HPC."


- slug: peter-thiel
  name: Peter Thiel
  name_full: Peter Thiel
  description: >
    Cofundador de PayPal, Palantir Technologies y Founders Fund. El 13 de mayo
    de 2026 se reunió en Mburuvicha Róga con el presidente Santiago Peña, quien
    publicó que conversaron sobre oportunidades para el capital privado en IA,
    energía y tecnología financiera. La visita fue exploratoria: no anunció
    inversión directa ni un proyecto propio. En su ensayo de 2009 escribió que
    «la gran tarea de los liberales es encontrar una salida de la política en
    todas sus formas» (traducción propia). Según el análisis publicado por este
    sitio, el debate local se centra en el historial de vigilancia de Palantir
    y en qué condiciones se usarían datos paraguayos.
  category: geopolítica
  faq:
    - q: "¿Qué dijo Peter Thiel sobre Paraguay?"
      a: "La declaración pública verificada es el posteo de Santiago Peña: «Conversamos sobre las oportunidades que Paraguay ofrece para el capital privado en sectores como inteligencia artificial, energía y tecnología financiera». No hay cita de Thiel sobre Itaipú, Yguazú Digital ni experimentos de gobernanza."
    - q: "¿Qué ideas defendió Thiel en su ensayo de 2009?"
      a: "En «The Education of a Libertarian» escribió: «In our time, the great task for libertarians is to find an escape from politics in all its forms» (traducción propia), y describió al ciberespacio y al seasteading como formas de escape de la política."
    - q: "¿Peter Thiel tiene inversiones en Paraguay?"
      a: "No hay inversión directa confirmada. La visita de mayo de 2026 no incluyó un anuncio de proyecto propio; los vínculos con la energía de Itaipú y Yguazú Digital son interpretaciones del análisis publicado por este sitio."


- slug: santiago-pena
  name: Santiago Peña
  name_full: Santiago Peña Palacios
  description: >
    Expresidente de Paraguay. Asumió el 15 de agosto de 2023 y fue destituido
    por el Senado el 6 de noviembre de 2026 por mal desempeño en el caso Ueno
    Bank; lo reemplazó Pedro Alliana. Antes fue ministro de Hacienda
    (2015-2017). Su gobierno impulsó la apertura del sector eléctrico (Ley
    7599, Decreto 6034), promovió Yguazú Digital con Taiwán y buscó atraer data
    centers. Desde el 7 de noviembre de 2026 cumple prisión preventiva; según
    el acta de imputación fiscal N.º 7, está imputado por lesión de confianza,
    producción inmediata de documentos públicos de contenido falso y
    administración en provecho propio. Se abstuvo de declarar y no hay condena.
    La causa investiga el colapso de Ueno Bank: según el acta, fue titular de
    aproximadamente el 1,58 % de Ueno Holding, no del banco, hasta el rescate
    de sus acciones en marzo de 2025. Paraguay sigue sin una estrategia
    nacional de IA aprobada.
  category: gobierno
  manual_articles:
    - title: "Qué datos tuyos tenía Ueno y qué pasa con ellos ahora"
      url: /articulos/2026/11/13/que-datos-tuyos-tenia-ueno/
      context: "El colapso de Ueno Bank desencadenó el juicio político y la prisión preventiva de Santiago Peña. El artículo documenta qué datos acumuló el banco y qué pasó con ellos tras la resolución."
  faq:
    - q: "¿Qué políticas de energía e IA impulsó Santiago Peña?"
      a: "Peña impulsó la Ley 7599/2025 (apertura del sector eléctrico) y el Decreto 6034/2026 (6 fuentes renovables); bajo su gobierno la ANDE emitió la Resolución 52552/2026 (tarifa IA). Convocó la Mesa Energética Nacional en agosto de 2026."
    - q: "¿Qué se le imputa a Santiago Peña en el caso Ueno?"
      a: "El acta fiscal N.º 7 lo imputa por «Lesión de confianza, Producción inmediata de documentos públicos de contenido falso y Administración en provecho propio». Según RTVE, se abstuvo de declarar. La imputación y la prisión preventiva son medidas cautelares: no hay condena."
    - q: "¿Qué es la Mesa Energética Nacional?"
      a: "Organismo asesor creado en 2012, reactivado en 2023 por Peña. En agosto de 2026 dio 30 días para propuestas en 4 ejes: institucionalidad, generación, mesa eléctrica público-privada y reglas para inversores."


- slug: bid
  name: BID
  name_full: Banco Interamericano de Desarrollo
  description: >
    Organismo multilateral que financió la Agenda Digital de Paraguay con un
    préstamo de USD 130M (2019) y participó como socio del MOPC y el VMME en la
    publicación de la Estrategia Nacional de Hidrógeno Verde (2025). Socio
    recurrente en infraestructura digital y energética del país. El Data Center
    Estatal Tier III del MITIC también fue financiado por el BID.
  category: geopolítica
  faq:
    - q: "¿Qué financiamiento aporta el BID a Paraguay en tecnología?"
      a: "El BID financió con USD 130 millones (2019) el programa de Red Nacional de Fibra Óptica para extender la conectividad y mejorar la calidad del servicio. La Etapa 1 agrupó redes de organismos públicos."
    - q: "¿El BID participa en la política energética de Paraguay?"
      a: "El BID apoyó el estudio Ceare (UBA) sobre tarifas de ANDE 2026-2030, que proyecta un aumento del 39,4% en la tarifa media para 2030. Es una proyección, no una tarifa vigente."
    - q: "¿El BID financió la Estrategia de Hidrógeno Verde?"
      a: "El documento de 2025 figura publicado por MOPC/VMME/BID. La fuente abierta acredita participación y publicación, no un contrato de financiamiento específico."


- slug: tsmc
  name: TSMC
  name_full: Taiwan Semiconductor Manufacturing Company
  description: >
    El mayor fabricante de chips por encargo (foundry), con 72,5% del mercado
    en el segundo trimestre de 2026. Produce más del 90% de los chips avanzados
    del mundo. Expertos taiwaneses del sector, no identificados como delegados
    de TSMC en la fuente abierta, participaron en foros bilaterales
    Paraguay-Taiwán. Fabrica chips diseñados por otras empresas y no vende
    chips con marca propia. La mayor parte de su capacidad avanzada está
    concentrada en Taiwán, lo que convierte a la isla en un punto crítico de la
    cadena global de IA. Para Paraguay, su relevancia es geopolítica: explica
    por qué Taiwán es un socio estratégico y por qué la relación con China
    condiciona la agenda tecnológica.
  category: geopolítica
  faq:
    - q: "¿TSMC tiene presencia en Paraguay?"
      a: "TSMC no tiene fábrica operativa en Paraguay. Su relevancia para el país es geopolítica: es el mayor fabricante de chips por encargo y concentra la mayor parte de su capacidad avanzada en Taiwán."
    - q: "¿Qué participación tiene TSMC en los chips de IA?"
      a: "Produce más del 90% de los chips más avanzados del mundo, según The Conversation. En el segundo trimestre de 2026 tuvo el 72,5% del mercado de fundición, según TrendForce."
    - q: "¿Hubo delegados de TSMC en foros con Paraguay?"
      a: "La fuente abierta del MIC menciona expertos taiwaneses del sector en foros bilaterales, sin identificarlos como delegados de TSMC."


- slug: sopaia
  name: SOPAIA
  name_full: Sociedad Paraguaya de Inteligencia Artificial
  description: >
    Organización de utilidad pública sin fines de lucro que reúne a
    profesionales, investigadores y entusiastas de la IA en Paraguay. Promueve
    el uso ético, responsable y participativo de la inteligencia artificial,
    articulando academia, sector público, empresas y sociedad civil. IBERAMIA
    2026, la 19ª Conferencia Iberoamericana de Inteligencia Artificial en
    Asunción, es organizada por la UNA y la UCA, con el apoyo de UCOM y SOPAIA.
    Sus estatutos datan de 2023. Impulsa espacios abiertos y apoya el análisis
    técnico y la generación de conocimiento aplicado al contexto paraguayo. En
    un contexto sin estrategia nacional de IA aprobada, su agenda de comunidad
    carece de marco de política.
  category: comunidad
  manual_articles:
    - title: "SOPAIA — organización nacional para conectar conocimiento, tecnología y propósito público"
      url: https://www.sopaia.org/
      context: "El sitio oficial define a SOPAIA como organización de utilidad pública sin fines de lucro y promueve el uso ético, responsable y participativo de la IA."
    - title: "IBERAMIA 2026 — convocatoria oficial"
      url: https://www.iberamia.org/iberamia/iberamia2026/call-for-papers
      context: "La convocatoria oficial indica que la conferencia es organizada por la UNA y la UCA, con el apoyo de UCOM y SOPAIA."
  faq:
    - q: "¿Qué es SOPAIA?"
      a: "SOPAIA es una organización paraguaya de utilidad pública sin fines de lucro que promueve el uso ético, responsable y participativo de la inteligencia artificial."
    - q: "¿SOPAIA organiza IBERAMIA 2026?"
      a: "No. La conferencia es organizada por la Universidad Nacional de Asunción y la Universidad Católica de Asunción, con el apoyo de UCOM y SOPAIA, según la convocatoria oficial."
    - q: "¿Qué actividades promueve SOPAIA?"
      a: "Impulsa espacios abiertos para profesionales, estudiantes, empresas e instituciones, y apoya el análisis técnico y la generación de conocimiento aplicado al contexto paraguayo."


- slug: pti-py
  name: PTI-PY
  name_full: Parque Tecnológico Itaipú Paraguay
  description: >
    Centro de investigación y desarrollo tecnológico vinculado a Itaipú
    Binacional. Opera una unidad experimental de hidrógeno verde con capacidad
    prevista de 2 Nm³/h, actualmente en fase de funcionamiento experimental.
    Un estudio del PTI-PY determinó que Paraguay tiene potencial para producir
    hidrógeno verde con energía vertida turbinable de Itaipú. Para este
    observatorio es un puente entre la energía de la binacional y la
    diversificación tecnológica de la región este; su escala es de
    investigación, no industrial.
  category: academia
  manual_articles:
    - title: "Hidrógeno verde en Paraguay: el laboratorio del PTI-PY y el proyecto Atome"
      url: /articulos/2026/07/27/hidrogeno-verde-paraguay/
      context: "El artículo analiza la unidad experimental del PTI-PY, de escala de laboratorio, frente al proyecto industrial de Atome, aún sin construcción."
    - title: "Itaipú 2027: la energía de Paraguay después del acuerdo"
      url: /articulos/2026/07/17/itaipu-2027-energia-paraguay/
      context: "El artículo sitúa la unidad experimental del PTI-PY entre los proyectos de hidrógeno verde existentes, sin operación comercial."
  faq:
    - q: "¿Qué es el PTI-PY?"
      a: "El PTI-PY (Parque Tecnológico Itaipú Paraguay) es un centro de investigación y desarrollo tecnológico vinculado a Itaipú Binacional."
    - q: "¿Qué produce su unidad de hidrógeno verde?"
      a: "Es una unidad experimental en fase de funcionamiento experimental, con capacidad prevista de 2 Nm³/h. No es producción industrial."
    - q: "¿Qué estudio realizó el PTI-PY con Itaipú?"
      a: "Un estudio del PTI-PY determinó que Paraguay tiene potencial para producir hidrógeno verde con energía vertida turbinable de la hidroeléctrica Itaipú, según Itaipú Binacional (21 de agosto de 2025)."


- slug: universidad-nacional
  name: UNA
  name_full: Universidad Nacional de Asunción
  description: >
    La universidad más grande de Paraguay, fundada en 1889. Sus facultades de
    Ingeniería y Politécnica participan en la formación de profesionales
    tecnológicos del país, que gradúa en promedio unos 400 informáticos por
    año (INE vía La Tribuna, 22 de enero de 2026). Co-organiza IBERAMIA 2026
    con la UCA, con el apoyo de UCOM y SOPAIA. Para este observatorio
    representa la capacidad de formación de talento tech del país.
  category: academia
  faq:
    - q: "¿Qué rol tiene la Universidad Nacional en IA?"
      a: "La Universidad Nacional de Asunción (UNA) es la universidad más grande de Paraguay, fundada en 1889, con facultades de ingeniería y ciencias que forman profesionales en tecnología. Participa en IBERAMIA 2026, organizada con la UCA."
    - q: "¿Cuántos informáticos gradúa Paraguay por año?"
      a: "El país forma en promedio unos 400 profesionales informáticos por año, según datos del INE publicados por La Tribuna (22 de enero de 2026). La cifra es nacional, no exclusiva de la UNA."
    - q: "¿Qué es IBERAMIA 2026?"
      a: "Es la 19ª Conferencia Iberoamericana de Inteligencia Artificial, a realizarse en Asunción en noviembre de 2026. La organizan la UNA y la UCA, con el apoyo de UCOM y SOPAIA."


- slug: amcham
  name: AmCham Paraguay
  name_full: Cámara de Comercio Paraguayo-Americana
  description: >
    Cámara binacional que impulsó un foro internacional para posicionar a
    Paraguay como hub de inteligencia artificial, energía limpia e
    infraestructura digital. AmCham y Parcapy organizaron el foro en Silicon
    Valley en junio de 2026; Marco Riquelme (MIC) fue uno de los expositores.
    Para este observatorio cumple una función de articulación comercial e
    institucional: en el debate de IA, su valor está en conectar empresas
    paraguayas con inversores estadounidenses y traducir prioridades de
    política a agendas de negocios. Su influencia depende de la agenda de sus
    miembros y de su capacidad de convocar a decisores públicos.
  category: comunidad
  manual_articles:
    - title: "IA y tecnología: Amcham organiza foro en Silicon Valley"
      url: https://www.abc.com.py/politica/2026/06/22/ia-y-tecnologia-amcham-organiza-foro-en-silicon-valley
      context: "ABC Color informó que AmCham y Parcapy organizaron el foro estratégico de junio de 2026 con la ponencia del ministro Marco Riquelme."
    - title: "Lo que el capital de Silicon Valley busca en Paraguay y no encuentra"
      url: /articulos/2026/07/31/silicon-valley-cono-sur-paraguay/
      context: "El artículo describe la misión del ministro Marco Riquelme a Silicon Valley en marzo de 2026 y las razones por las que el capital inversionista aún no se decide."
  faq:
    - q: "¿Qué es AmCham Paraguay?"
      a: "AmCham Paraguay es la Cámara de Comercio Paraguayo-Americana; según ABC Color, busca capitalizar el clima de negocios entre ambos países para atraer empresas interesadas."
    - q: "¿Qué foro organizó AmCham en 2026?"
      a: "AmCham y Parcapy organizaron en junio de 2026 un foro estratégico en Silicon Valley con la ponencia del ministro Marco Riquelme (MIC), según ABC Color."
    - q: "¿AmCham regula la inteligencia artificial en Paraguay?"
      a: "No. En la fuente verificada figura como organizadora del foro junto a Parcapy, no como autoridad regulatoria."


- slug: conatel
  name: Conatel
  name_full: Comisión Nacional de Telecomunicaciones
  description: >
    Organismo regulador de las telecomunicaciones de Paraguay. Administra el
    espectro radioeléctrico y adjudicó las licitaciones de 5G: la primera en
    2025 (Claro y Nubicom) y la segunda en 2026 (Tigo y Personal). Regula la
    conectividad del país.
  category: gobierno
  faq:
    - q: "¿Qué regula CONATEL en Paraguay?"
      a: "CONATEL (Comisión Nacional de Telecomunicaciones) regula las telecomunicaciones, incluyendo el espectro radioeléctrico, la calidad de servicio y la conectividad."
    - q: "¿Qué norma crea CONATEL?"
      a: "La Ley 642/95 de Telecomunicaciones atribuye al Estado el fomento, control y reglamentación del sector a través de la Comisión Nacional de Telecomunicaciones."
    - q: "¿Cómo se adjudicó el espectro 5G?"
      a: "La primera licitación (2025) adjudicó 200 MHz a Claro y Nubicom; la segunda (2026) adjudicó bandas de 2.300-2.400 MHz a Tigo y de 3.700-3.800 MHz a Personal."


- slug: tigo
  name: Tigo
  name_full: Tigo Paraguay (Telecel S.A.E.)
  description: >
    El principal operador móvil de Paraguay, con casi 4 millones de clientes.
    Opera un data center Tier III certificado en Villa Elisa desde 2016, sobre
    el que corre BUZZ AI Cloud de HIVE desde marzo de 2026, y ganó espectro 5G
    en 2.300-2.400 MHz en la segunda licitación (2026). Para este observatorio
    es un actor relevante de la conectividad y la infraestructura digital del
    país.
  category: empresa
  faq:
    - q: "¿Tigo tiene un data center Tier III en Paraguay?"
      a: "Sí. Tigo opera un data center Tier III certificado en Villa Elisa, donde HIVE lanzó BUZZ AI Cloud en marzo de 2026. La fuente abierta verificada acredita la certificación; el conteo de certificaciones vigentes en el país requiere el registro público de Uptime Institute."
    - q: "¿Qué espectro 5G ganó Tigo?"
      a: "En la segunda licitación de 2026, CONATEL declaró seleccionada a Telecel S.A.E. (Tigo) en el rango de 2.300-2.400 MHz."
    - q: "¿Cuántos clientes tiene Tigo en Paraguay?"
      a: "Millicom informó que Tigo es el principal operador móvil de Paraguay, con casi 4 millones de clientes."


- slug: bcp
  name: BCP
  name_full: Banco Central del Paraguay
  description: >
    Autoridad monetaria de Paraguay y operador del SIPAP/SIP, el sistema de
    pagos del país. Su módulo de pagos instantáneos (SPI) movió en 2025 el
    equivalente a más de tres veces el PIB. En 2026 lanzó el QR Hub
    interoperable y una hoja de ruta para expandir los pagos a comercios e
    impuestos, con un proyecto piloto para estudiar la conexión con Pix de
    Brasil, sin integración operativa.
  category: gobierno
  manual_articles:
    - title: "Qué datos tuyos tenía Ueno y qué pasa con ellos ahora"
      url: /articulos/2026/11/13/que-datos-tuyos-tenia-ueno/
      context: "El BCP dispuso la resolución de ueno bank el 2-nov-2026 y pagó el anticipo del FGD; la ley de resolución no menciona datos personales."
    - title: "Paraguay tiene más fintechs que bancos y recién empieza"
      url: /articulos/2026/07/10/fintech-paraguay-ecosistema/
      context: "La Ley 7503/2025 creó el Sistema Nacional de Pagos y extendió la supervisión del BCP a las fintech; el artículo analiza el ecosistema y sus límites."
  faq:
    - q: "¿Qué es el BCP y su rol en pagos digitales?"
      a: "El Banco Central del Paraguay (BCP) gestiona el Sistema de Pagos Instantáneos (SPI) con 382 millones de operaciones en 2025 y lanzó el QR Hub para pagos interoperables."
    - q: "¿Qué es el QR Hub del BCP?"
      a: "El QR Hub es una plataforma centralizada del BCP que permite pagos por transferencia directa entre cuentas, con tope del 1,5% IVA incluido y límite de G. 10 millones."
    - q: "¿El QR Hub ya está conectado con Pix?"
      a: "No. El BCP desarrolla un proyecto piloto para conocer la factibilidad de la conexión con otros sistemas, por ejemplo Pix de Brasil; no hay integración oficial operativa."


- slug: bancard
  name: Bancard
  name_full: Bancard S.A.
  description: >
    Procesadora de pagos paraguaya que desarrolló el estándar PY-QR de pagos
    con código QR, aprobado por el BCP en 2025. Desde 2024 permite a los
    comercios paraguayos cobrar con Pix de Brasil en sus POS Azul, mientras la
    integración oficial SPI↔Pix sigue sin acuerdo firmado.
  category: empresa
  manual_articles:
    - title: "Paraguay tiene más fintechs que bancos y recién empieza"
      url: /articulos/2026/07/10/fintech-paraguay-ecosistema/
      context: "Bancard es el procesador dominante de pagos digitales en Paraguay, con POS, QR, vPOS y Tokefon; el artículo analiza su rol en el ecosistema fintech."
  faq:
    - q: "¿Qué es Bancard y su red PY-QR?"
      a: "Bancard opera la red privada PY-QR con más de 181.000 comercios, más de 75 aplicaciones (bancos, financieras, cooperativas y billeteras) y 68,1% de los pagos electrónicos de su red."
    - q: "¿Bancard permite cobrar con Pix de Brasil?"
      a: "Sí: desde 2024 ofrece cobro con Pix brasileño en sus POS Azul, según ABC Color. La integración oficial entre SPI y Pix sigue sin acuerdo firmado."
    - q: "¿Qué es el estándar PY-QR?"
      a: "Es el estándar de pagos con código QR desarrollado por Bancard y aprobado por el BCP en 2025, según ABC Color."


- slug: migraciones
  name: Migraciones
  name_full: Dirección Nacional de Migraciones (DNM)
  description: >
    Autoridad migratoria de Paraguay. Concede la residencia permanente y aplica
    la Ley 6984/2022. El artículo 46 de esa ley es la base de la residencia
    permanente por inversión que promociona el Investor Pass; Migraciones
    registró 47.687 solicitudes y otorgó 40.600 residencias en 2025.
  category: gobierno
  related_laws:
    - "Ley 6984/2022 - Migraciones, art. 46 residencia permanente por inversión"
    - "Resolución MIC 0283/2026 - Constancia de Inversionista Extranjero"
  manual_articles:
    - title: "Residencia permanente para inversores en Paraguay: requisitos y trámite"
      url: /articulos/2026/09/25/paraguay-investor-pass-residencia-inversores/
      context: "La Resolución MIC 0283/2026 reglamenta la Constancia de Inversionista Extranjero; la residencia permanente la concede Migraciones al amparo del artículo 46 de la Ley 6984/2022."
  faq:
    - q: "¿La Dirección de Migraciones ofrece trámites digitales?"
      a: "La Dirección Nacional de Migraciones permite iniciar trámites en línea a través de Paraguay.gov.py, como consultas de estado migratorio y solicitudes de documentos; algunos exigen presentación física de documentos originales."
    - q: "¿Cuántas residencias se otorgaron en 2025?"
      a: "La DNM registró 47.687 solicitudes ingresadas y otorgó 40.600 residencias en 2025, según su informe oficial publicado en enero de 2026."
    - q: "¿Qué ley regula la residencia por inversión?"
      a: "La Ley 6984/2022; su artículo 46 exceptúa del requisito de residencia temporal previa a quien acredite inversiones al amparo de la Ley 4986/2013."


- slug: ministerio-energia
  name: Ministerio de Energía
  name_full: Ministerio de Energía, Minería e Hidrocarburos
  description: >
    Ministerio propuesto por el Ejecutivo el 13 de agosto de 2026. El proyecto
    crea tres viceministerios (Energía, Minería e Hidrocarburos) y absorbería al
    Viceministerio de Minas y Energía (MOPC) y a la Dirección de Combustibles
    (MIC). Es un proyecto en debate, no una institución creada.
  category: gobierno
  related_laws:
    - "Proyecto de ley de creación del Ministerio de Energía, Minería e Hidrocarburos (2026)"
    - "Ley 7599/2025 y Decreto 6034/2026 - apertura del sector eléctrico"
  manual_articles:
    - title: "El ministerio de energía que Paraguay prepara con tres viceministerios"
      url: /articulos/2026/08/19/ministerio-energia-mineria-hidrocarburos/
      context: "El proyecto crea el Ministerio de Energía, Minería e Hidrocarburos con tres viceministerios y absorbería al VMME y a la Dirección de Combustibles."
    - title: "El modelo institucional de PSR para el sector eléctrico paraguayo"
      url: /articulos/2026/08/19/modelo-institucional-psr-sector-electrico/
      context: "El documento de PSR diagnostica funciones mezcladas entre VMME y ANDE y propone separarlas en ministerio, regulador y empresa."
    - title: "El ente regulador de energía que Paraguay diseña con concurso público"
      url: /articulos/2026/08/19/ente-regulador-energia/
      context: "El proyecto de ley del Ejecutivo crea un ente regulador de energía con concurso público, en paralelo al nuevo ministerio."
  faq:
    - q: "¿Existe el Ministerio de Energía en Paraguay?"
      a: "No. Es un proyecto de ley presentado en agosto de 2026 que crearía el 'Ministerio de Energía, Minería e Hidrocarburos' con 3 viceministerios. Actualmente solo existe el Viceministerio de Minas y Energía (VMME) dentro del MOPC."
    - q: "¿Cómo se nombra el proyecto en el texto oficial?"
      a: "El artículo 1 del expediente 139844 del SILPY dice «crear el Ministerio de Energía, Minería e Hidrocarburos»; el encabezado del expediente usa «Minas». El nombre del articulado es el que se usa en esta ficha."
    - q: "¿Qué organismos absorbería el nuevo ministerio?"
      a: "Sustituiría al Viceministerio de Minas y Energía del MOPC y transferiría del MIC la Dirección General de Combustibles, según los artículos 1 y 16 del proyecto."

