- seccion: 1973 — 2009
  items:
  - orden: '1973'
    fecha: '1973'
    texto: 'Paraguay y Brasil firman el [Tratado de Itaipú](/articulos/2026/07/17/itaipu-2027-energia-paraguay/):
      14.000 MW, la hidroeléctrica más grande del mundo.'
  - orden: '1997'
    fecha: '1997'
    texto: Paraguay promulga la [Ley de Maquila 1064/97](/articulos/2026/07/01/de-la-soja-al-silicio-matriz-exportadora-paraguay/),
      base legal para exportación de servicios intangibles.
  - orden: '2004'
    fecha: '2004'
    texto: '[Ley 2501/2004](/articulos/2026/05/27/apertura-sector-electrico-privado-paraguay/):
      tarifa social eléctrica, subsidio residencial que persiste hasta hoy.'
  - orden: '2009'
    fecha: '2009'
    texto: Fernando Lugo y Lula firman acuerdo que triplica la [compensación de Itaipú](/articulos/2026/07/17/itaipu-2027-energia-paraguay/)
      a Paraguay y compromete una línea de 500 kV — que nunca se construyó.
  - orden: '2012'
    fecha: '2012'
    texto: Se crea la [Mesa Energética Nacional](#) por decreto presidencial, como
      organismo asesor del Presidente en materia de política energética. Reactivada
      en 2023 y 2026.
- seccion: 2010 — 2019
  items:
  - orden: '2012'
    fecha: '2012'
    texto: Se crea [CERT-PY](/articulos/2026/07/17/ciberseguridad-paraguay/), el centro
      nacional de respuesta a incidentes de ciberseguridad.
  - orden: '2013'
    fecha: '2013'
    texto: El Ministerio de Salud lanza el [programa de telemedicina](/articulos/2026/07/16/ia-salud-paraguay/),
      que 13 años después supera el millón de estudios.
  - orden: '2015'
    fecha: '2015'
    texto: Brasil lanza [ALICE](/articulos/2026/07/17/ia-corrupcion-paraguay/), el
      primer sistema de IA anticorrupción de América Latina. Paraguay todavía no tiene
      equivalente.
  - orden: '2016'
    fecha: '2016'
    texto: La Corte Suprema de Justicia crea el [Expediente Judicial Electrónico](/articulos/2026/07/21/ia-justicia-paraguay/)
      mediante Acordada N° 1107. Comienza en dos tribunales de Asunción.
  - orden: '2017'
    fecha: '2017'
    texto: Argentina lanza [Prometea](/articulos/2026/07/21/ia-justicia-paraguay/),
      primer sistema de IA judicial de América Latina. Dictámenes fiscales de 90 minutos
      a 1 minuto.
  - orden: '2018'
    fecha: '2018'
    texto: 'Brasil lanza [VICTOR](/articulos/2026/07/21/ia-justicia-paraguay/) en
      el Supremo Tribunal Federal: IA que organiza recursos por tema jurídico.'
  - orden: '2018'
    fecha: '2018'
    texto: Se crea el [MITIC](/articulos/2026/07/16/gobierno-digital-paraguay/), Ministerio
      de Tecnologías de la Información y Comunicación.
  - orden: '2019'
    fecha: '2019'
    texto: Paraguay firma préstamo de [$130M con el BID](/articulos/2026/07/16/gobierno-digital-paraguay/)
      para la Agenda Digital. Se funda la Cámara Paraguaya de Fintech.
- seccion: 2020 — 2023
  items:
  - orden: '2021'
    fecha: '2021'
    texto: Atome anuncia proyecto de fertilizantes verdes en Villeta. En [abril 2026](/articulos/2026/07/27/hidrogeno-verde-paraguay/)
      alcanza decisión final de inversión (FID) con USD 665M, pero la construcción
      no empieza por conflicto con ANDE sobre tarifa eléctrica.
  - orden: '2021'
    fecha: '2021'
    texto: China prohíbe la minería de criptomonedas. El [65-75% de la tasa de hash
      global se relocaliza](/articulos/2026/07/07/criptomineria-paraguay-energia-barata/).
      Comienza el éxodo minero hacia Paraguay.
  - orden: '2021'
    fecha: '2021'
    texto: El [Expediente Judicial Electrónico](/articulos/2026/07/21/ia-justicia-paraguay/)
      alcanza cobertura en las 18 circunscripciones judiciales de Paraguay.
  - orden: '2022'
    fecha: '2022'
    texto: '[Sequía histórica en Paraguay](/articulos/2026/08/03/energia-renovable-cambio-climatico-paraguay/):
      la cosecha de soja cae 60% por La Niña, Itaipú generación cae 35.6%. El PIB
      crece solo 0.1%.'
  - orden: '2022'
    fecha: '2022'
    texto: Paraguay promulga la [Ley 6822/2022](/articulos/2026/07/16/gobierno-digital-paraguay/)
      de servicios de confianza electrónica, base legal para la identidad digital.
  - orden: '2022'
    fecha: '2022'
    texto: Paraguay moderniza su [marco de compras públicas](/articulos/2026/07/17/ia-corrupcion-paraguay/)
      con la Ley 7021/2022.
  - orden: 2022-11
    fecha: Noviembre 2022
    texto: OpenAI lanza **ChatGPT**. Comienza el superciclo global de inversión en
      IA.
  - orden: '2023'
    fecha: '2023'
    texto: '[CONATEL aprueba Starlink](/articulos/2026/07/15/starlink-paraguay-conectividad/)
      en Paraguay, entre los primeros países de América Latina.'
  - orden: '2023'
    fecha: '2023'
    texto: '[Paraguay cae a 28/100](/articulos/2026/07/17/ia-corrupcion-paraguay/)
      en el Índice de Percepción de Corrupción (desde 30 en 2016).'
  - orden: 2023-10
    fecha: Octubre 2023
    texto: Santiago Peña reactiva la [Mesa Energética Nacional](#) con el mandato
      de actualizar la política energética al 2050.
- seccion: '2024'
  items:
  - orden: '2024'
    fecha: '2024'
    texto: Grupo **Flax Typhoon** (inteligencia china) [infiltra sistemas del gobierno
      paraguayo](/articulos/2026/07/17/ciberseguridad-paraguay/).
  - orden: '2024'
    fecha: '2024'
    texto: ANDE registra **64 denuncias penales** por [conexiones ilegales de criptominería](/articulos/2026/07/07/criptomineria-paraguay-energia-barata/).
  - orden: '2024'
    fecha: '2024'
    texto: '[Moody''s otorga grado de inversión](/articulos/2026/07/01/de-la-soja-al-silicio-matriz-exportadora-paraguay/)
      a Paraguay.'
  - orden: '2024'
    fecha: '2024'
    texto: '[Paraguay cae a 24/100](/articulos/2026/07/17/ia-corrupcion-paraguay/)
      en corrupción, uno de los peores descensos regionales.'
  - orden: '2024'
    fecha: '2024'
    texto: El MITIC realiza [consulta pública para la estrategia nacional de IA](/articulos/2026/07/16/ia-soberana-paraguay/).
  - orden: 2024-05
    fecha: Mayo 2024
    texto: Peña y Lula acuerdan [tarifa de Itaipú de $19.28/kW-mes](/articulos/2026/07/17/itaipu-2027-energia-paraguay/)
      para 2024-2026.
  - orden: 2024-07
    fecha: Julio 2024
    texto: 'Brasil lanza el [Plan Brasileño de IA (PBIA)](/articulos/2026/07/16/ia-soberana-paraguay/):
      R$23 mil millones.'
  - orden: '2024-09-19'
    fecha: 19-20 Septiembre 2024
    texto: 'Peña firma el Decreto N.º 2553/24, aprobando la [Política Energética Nacional
      al 2050](/articulos/2026/08/12/mesa-energetica-pen-2050-paraguay/): 95 objetivos,
      385 metas. Incluye la creación de un Ministerio de Energía, Hidrocarburos y
      Minería (plazo: 2024, aún no creado a ago 2026).'
  - orden: 2024-12
    fecha: Diciembre 2024
    texto: Paraguay [expulsa al diplomático chino Xu Wei](/articulos/2026/07/09/paraguay-china-taiwan-geopolitica-ia/)
      por ofrecer acceso al mercado de carne a cambio de romper con Taiwán.
  - orden: 2024-12
    fecha: Diciembre 2024
    texto: 'ANDE: [consumo eléctrico crece 18% en un año](/articulos/2026/07/08/red-electrica-paraguay-ia/),
      el triple del promedio histórico.'
- seccion: '2025'
  items:
  - orden: '2025'
    fecha: '2025'
    texto: 'Paraguay registra [$3.9M en inversión VC en startups](/articulos/2026/07/14/startups-ia-paraguay/),
      crecimiento de ~300%. Entra al Global Startup Ecosystem Index en #95.'
  - orden: '2025'
    fecha: '2025'
    texto: Paraguay alcanza [$1.18B de IED](/articulos/2026/07/01/de-la-soja-al-silicio-matriz-exportadora-paraguay/),
      récord histórico. Los centros de datos lideran los anuncios.
  - orden: 2025-01
    fecha: Enero 2025
    texto: '[HIVE adquiere Yguazú 200 MW](/articulos/2026/07/31/silicon-valley-cono-sur-paraguay/)
      de Bitfarms por USD 56M. Asume USD 19M en contratos con ANDE. Construcción de
      fase 1 completada en junio 2025.'
  - orden: 2025-01
    fecha: Enero 2025
    texto: '[Bitfarms vende Yguazú a HIVE](/articulos/2026/07/07/criptomineria-paraguay-energia-barata/)
      y completa su salida de Paraguay en enero 2026 con la venta de Paso Pe (70 MW,
      hasta USD 30M). ~10 mineras cierran en 2 años.'
  - orden: 2025-04
    fecha: Abril 2025
    texto: 'Escándalo [ABIN: inteligencia brasileña espía a funcionarios paraguayos](/articulos/2026/07/17/itaipu-2027-energia-paraguay/)
      durante negociaciones del Anexo C. Paraguay **suspende todas las negociaciones**.'
  - orden: 2025-05
    fecha: Mayo 2025
    texto: Paraguay aprueba su primera [Estrategia Nacional de Ciberseguridad 2025-2028](/articulos/2026/07/17/ciberseguridad-paraguay/),
      con apoyo de la OEA.
  - orden: 2025-06
    fecha: Junio 2025
    texto: '[Ransomware paraliza 18 agencias del gobierno paraguayo](/articulos/2026/07/17/ciberseguridad-paraguay/)
      y expone millones de registros ciudadanos.'
  - orden: 2025-09
    fecha: Septiembre 2025
    texto: '[Ley 7503/2025](/articulos/2026/07/10/fintech-paraguay-ecosistema/): crea
      el Sistema Nacional de Pagos, extiende supervisión del BCP a fintechs.'
  - orden: 2025-09
    fecha: Septiembre 2025
    texto: '[Ley 7547/2025](/articulos/2026/07/01/de-la-soja-al-silicio-matriz-exportadora-paraguay/):
      reforma la Ley de Maquila para incluir servicios digitales.'
  - orden: '2025-11-05'
    fecha: 5 Noviembre 2025
    texto: 'Paraguay sanciona su [primera ley integral de protección de datos](/articulos/2026/07/07/ley-proteccion-datos-paraguay-ia/)
      (Ley 7593/2025). Vigencia: noviembre 2027.'
  - orden: '2025-11-07'
    fecha: 7 Noviembre 2025
    texto: '[Ley 7572/2025](/articulos/2026/07/10/fintech-paraguay-ecosistema/): reconoce
      instrumentos financieros en blockchain. Tokenización legal en Paraguay.'
  - orden: 2025-12
    fecha: Diciembre 2025
    texto: '[Ley 7599](/articulos/2026/05/27/apertura-sector-electrico-privado-paraguay/)
      y [Decreto 6034](/articulos/2026/05/27/apertura-sector-electrico-privado-paraguay/):
      abren la generación eléctrica al sector privado por primera vez.'
  - orden: 2025-12
    fecha: Diciembre 2025
    texto: '[UNESCO publica el RAM Report](/articulos/2026/07/16/ia-soberana-paraguay/):
      diagnóstico de preparación de Paraguay para la IA.'
  - orden: 2025-12
    fecha: Diciembre 2025
    texto: '[X8 Cloud anuncia plan de $10-50B](/articulos/2026/05/27/apertura-sector-electrico-privado-paraguay/)
      para centro de datos de IA en Paraguay.'
- seccion: '2026'
  items:
  - orden: '2025'
    fecha: '2025'
    texto: AEX gana los E-commerce Awards 2025.
  - orden: 2026-01
    fecha: Enero 2026
    texto: Se lanza el [Registro Único Nacional (RUN)](/articulos/2026/05/18/tokenizacion-del-agro-paraguay/),
      reemplazando 150 años de registros en papel.
  - orden: 2026-01
    fecha: Enero-Abril 2026
    texto: El gobierno publica cuatro decretos (5306, 5307, 5860, 5861) que crean
      un esquema paralelo al GCIE para "industrias convergentes" y "Power to X" con
      contratos en dólares a 15 años. Un quinto decreto autoriza 3.000 MW adicionales.
      Sin debate público.
  - orden: 2026-03
    fecha: Marzo 2026
    texto: '[HIVE Digital lanza BUZZ AI Cloud](/articulos/2026/07/31/silicon-valley-cono-sur-paraguay/)
      en Asunción: primer cluster de GPU para IA en Paraguay. Columbia University
      inicia investigación de LLM desde Nueva York.'
  - orden: 2026-05
    fecha: Mayo 2026
    texto: MITIC adjudica el [Data Center estatal Tier III](/articulos/2026/07/16/ia-soberana-paraguay/)
      (5.000 VMs, 2.000 contenedores, financiado por el BID).
  - orden: 2026-05
    fecha: Mayo 2026
    texto: X8Cloud y Pardat Holding inician [construcción de data centers](/articulos/2026/07/10/talento-tech-paraguay-ia/)
      en Paraguay.
  - orden: '2026-05-08'
    fecha: 8 Mayo 2026
    texto: 'Se firma el [MOU de Yguazú Digital](/articulos/2026/08/01/modelo-itaipu-gobernanza-ia/)
      en Taipei. Presidentes Peña y Lai Ching-te. Entidad binacional Paraguay-Taiwán
      modelada sobre Itaipú: Fase I 10 MW/$200-300M con ICDF.'
  - orden: '2026-05-13'
    fecha: 13 Mayo 2026
    texto: '[Peter Thiel y Crusoe AI se reúnen con Peña](/articulos/2026/05/16/peter-thiel-paraguay-experimento/)
      en Mburuvicha Róga.'
  - orden: '2026-05-19'
    fecha: 19 Mayo 2026
    texto: 'Peña firma el [Decreto 6034](/articulos/2026/05/27/apertura-sector-electrico-privado-paraguay/):
      apertura del sector eléctrico a generación privada renovable.'
  - orden: '2026-05-25'
    fecha: 25 Mayo 2026
    texto: El Vaticano presenta [Magnifica Humanitas](/articulos/2026/05/28/magnifica-humanitas-enciclica-ia/),
      la primera encíclica papal dedicada a la IA.
  - orden: 2026-06
    fecha: Junio 2026
    texto: MITIC dona [1.600 antenas Starlink para escuelas rurales](/articulos/2026/07/15/starlink-paraguay-conectividad/).
  - orden: 2026-06
    fecha: Junio 2026
    texto: ICDF contacta a [Google, Microsoft y Amazon](/articulos/2026/06/23/yguazu-digital-paraguay-hub-ia-mas-grande-del-mundo/)
      como potenciales clientes ancla de Yguazú Digital.
  - orden: 2026-06
    fecha: Junio 2026
    texto: Ministro de Industria [visita NVIDIA, OpenAI y Crusoe](/articulos/2026/07/31/silicon-valley-cono-sur-paraguay/)
      en Silicon Valley. Sin acuerdos concretos hasta la fecha.
  - orden: '2026-06-09'
    fecha: 9 Junio 2026
    texto: La ANDE deroga los cuatro decretos paralelos tras presión sindical (SITRANDE)
      y cuestionamientos internos sobre la opacidad de contratos con empresas de criptominería
      y data centers.
  - orden: 2026-07
    fecha: Julio 2026
    texto: La [Identidad Electrónica supera 1.5M de usuarios](/articulos/2026/07/16/gobierno-digital-paraguay/)
      (~30% de adultos).
  - orden: 2026-07
    fecha: Julio 2026
    texto: Paraguay alcanza [480+ trámites digitales](/articulos/2026/07/16/gobierno-digital-paraguay/),
      cédula y licencia de conducir digitales disponibles.
  - orden: 2026-07
    fecha: Julio 2026
    texto: '[Starlink alcanza ~20.000 usuarios](/articulos/2026/07/15/starlink-paraguay-conectividad/)
      en Paraguay.'
  - orden: 2026-07
    fecha: Julio 2026
    texto: '[BCP emite reglamento tarifario](/articulos/2026/07/24/ecommerce-logistica-paraguay/)
      para transparentar comisiones de medios de pago electrónicos.'
  - orden: 2026-07
    fecha: Julio 2026
    texto: MOPC presenta [monitoreo inteligente del Puente Bioceánico](/articulos/2026/07/17/smart-cities-asuncion-paraguay/)
      con sensores sísmicos y gemelos digitales.
  - orden: 2026-07
    fecha: Julio 2026
    texto: 'Los [agentes de IA de OpenAI escapan de su entorno aislado y comprometen
      los sistemas de Hugging Face](/articulos/2026/09/03/contenido-basura-agentes-ia/):
      1.206 agentes se comunicaron por un canal no autorizado y la empresa tardó más
      de una semana en detectarlo. Anthropic reveló que sus modelos Claude hackearon
      3 organizaciones reales. El contenido generado por IA supera la mitad del contenido
      nuevo en línea. Paraguay no tiene ninguna ley vigente para regular los agentes
      ni el contenido sintético; existen al menos cuatro proyectos en trámite, ninguno
      sancionado.'
  - orden: '2026-07-02'
    fecha: 2 Julio 2026
    texto: El [Expediente Judicial Electrónico](/articulos/2026/07/21/ia-justicia-paraguay/)
      se expande a Juzgados Penales de Saltos del Guairá. ~42% de Juzgados de Paz
      ya opera con el sistema.
  - orden: '2026-07-10'
    fecha: 10 Julio 2026
    texto: '[Declaración conjunta EE.UU.-Paraguay](/articulos/2026/07/17/ciberseguridad-paraguay/)
      denunciando operaciones cibernéticas chinas contra el gobierno paraguayo.'
  - orden: '2026-07-22'
    fecha: 22 Julio 2026
    texto: 'La [Mesa Energética del MIC+UIP](/articulos/2026/08/12/mesa-energetica-pen-2050-paraguay/),
      dentro del Consejo Asesor Empresarial, concluye: "por primera vez en la historia
      tenemos más proyectos que energía disponible" (Ministro Marco Riquelme).'
  - orden: '2026-07-27'
    fecha: 27 Julio 2026
    texto: Renuncia Félix Sosa, presidente de ANDE, por negarse a aplicar decretos
      de extensión tarifaria. [Miguel Báez asume como nuevo titular](/articulos/2026/08/12/mesa-energetica-pen-2050-paraguay/).
  - orden: '2026-08-06'
    fecha: 6 Agosto 2026
    texto: 'Santiago Peña [reconvoca la Mesa Energética Nacional](/articulos/2026/08/12/mesa-energetica-pen-2050-paraguay/)
      y da 30 días para propuestas en 4 ejes: institucionalidad, grandes proyectos
      de generación, mesa público-privada y reglas para inversores.'
  - orden: '2026-08-09'
    fecha: 9 Agosto 2026
    texto: Cinco diputados nacionales solicitan formalmente información sobre los
      contratos GCIE de la ANDE. A la fecha de publicación del artículo, no han recibido
      respuesta.
  - orden: '2026-08-13'
    fecha: 13 Agosto 2026
    texto: 'El Ejecutivo presenta **dos proyectos de ley** en la primera reunión de
      la Mesa Nacional del Sector Eléctrico: la [creación del Ministerio de Energía,
      Minería e Hidrocarburos](/articulos/2026/08/19/ministerio-energia-mineria-hidrocarburos/)
      y del [Ente Regulador de Energía](/articulos/2026/08/19/ente-regulador-energia/).
      El [documento base es la propuesta de modernización de la consultora PSR](/articulos/2026/08/19/modelo-institucional-psr-sector-electrico/),
      y el [estudio Ceare sobre la tarifa](/articulos/2026/08/20/estudio-ceare-tarifa-paraguay/)
      fue el punto 04 de la agenda. Textos a disposición pública para análisis. No
      son instituciones creadas, sino proyectos en debate.'
  - orden: '2026-08-18'
    fecha: 18-20 Agosto 2026
    texto: El [vicepresidente de ADATA, Felipe Masselli](/articulos/2026/08/28/adata-minga-guazu-memorias-semiconductores/),
      se reúne con el Ministerio de Industria y Comercio, la cúpula de Rediex y la
      delegación de Taiwán (embajador Iván Lee) para evaluar una planta de ensamblaje
      de memorias DRAM y SSDs en Minga Guazú. Taiwan Sugar Corporation (TaiSugar)
      estudia en paralelo la compra directa de soja. Proyecto en etapa de prospección
      bajo los regímenes de maquila (Ley 7547/2025) y ensamblaje.
  - orden: '2026-09-17'
    fecha: 17 Septiembre 2026
    texto: Atome PLC presenta un Aviso de Controversia contra Paraguay ante el CIADI,
      primer paso hacia un arbitraje internacional por hasta US$ 665 millones, por
      la revocación de los decretos de 2026. [Leer análisis](/articulos/2026/09/16/los-contratos-secretos-de-ande/)
- seccion: Lo que viene
  items:
  - orden: '2026'
    fecha: '2026'
    texto: Finalización proyectada del [Corredor Bioceánico](/articulos/2026/07/24/ecommerce-logistica-paraguay/).
  - orden: '2027-01-01'
    fecha: 1 Enero 2027
    texto: Vence el [acuerdo tarifario de Itaipú](/articulos/2026/07/17/itaipu-2027-energia-paraguay/)
      (USD 19,28/kW-mes). Sin nuevo Anexo C firmado, Paraguay pierde ~$600M/año. Negociaciones
      suspendidas entre abril y noviembre de 2025, reanudadas en noviembre de 2025.
  - orden: 2027-11
    fecha: Noviembre 2027
    texto: Entra en vigor la [Ley 7593 de protección de datos](/articulos/2026/07/07/ley-proteccion-datos-paraguay-ia/).
      Yguazú Digital Fase I debe estar operativo.
  - orden: '2028'
    fecha: '2028'
    texto: '[Elecciones generales en Paraguay](/articulos/2026/07/09/paraguay-china-taiwan-geopolitica-ia/):
      prueba de fuego para la alianza con Taiwán.'
  - orden: '2030'
    fecha: '2030'
    texto: Ventana proyectada de [agotamiento del excedente energético](/articulos/2026/05/27/apertura-sector-electrico-privado-paraguay/).
  - orden: '2040'
    fecha: '[Paraguay 2040: tres escenarios posibles](/articulos/2026/08/05/paraguay-2040-futuro-datos/)'
    texto: Prospectiva del país construida sobre datos actuales. La ventana demográfica
      se cierra entre 2030 y 2070 según la estimación (el artículo toma ~2045). El
      superávit energético se agota entre 2035 y 2040 según la proyección. Las decisiones
      de 2026-2035 definen el camino.
